<title>Prismheart Playable Demo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Full-screen display: the 320x224 game fills the window at the largest sharp scale; nothing else is on screen.
   Every control lives in the Settings tabs (title OPTIONS, F1, Esc on the title, or View/Select on a pad).
   Touch controls appear only on touch screens (Controller tab: Touch Controls). Single dark look by design. */
:root { --ink: #eef3f8; --dim: #8fa1b4; --cyan: #5bd1f5; --display: "Pixelify Sans", "Courier New", monospace; --mono: "IBM Plex Mono", ui-monospace, monospace; color-scheme: dark; }
html, body { height: 100%; margin: 0; }
body { background: #000; color: var(--ink); font: 14px/1.45 var(--mono); overflow: hidden; overscroll-behavior: none; }
.stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: radial-gradient(120% 100% at 50% 40%, #0b0820 0%, #000 70%); }
.stage.portrait-touch { align-items: flex-start; padding-top: max(10px, env(safe-area-inset-top)); }
canvas#screen { image-rendering: pixelated; image-rendering: crisp-edges; display: block; background: #000; outline: none; box-shadow: 0 0 60px rgba(120, 90, 220, .18); }
.boot { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); font: 500 13px var(--mono); color: var(--dim); letter-spacing: .12em; text-align: center; padding: 0 16px; }
.toast { position: absolute; top: max(14px, env(safe-area-inset-top)); right: max(14px, env(safe-area-inset-right)); max-width: min(420px, 80vw); padding: 10px 14px 10px 12px;
  display: flex; gap: 10px; align-items: center; background: rgba(8, 16, 30, .86); border: 1px solid rgba(91, 209, 245, .45); border-radius: 6px; font: 13px/1.35 "Segoe UI", system-ui, sans-serif;
  opacity: 0; transform: translateY(-6px); pointer-events: none; transition: opacity .25s, transform .25s; }
.toast.on { opacity: 1; transform: none; }
.toast i { width: 8px; height: 8px; border-radius: 50%; background: var(--cyan); flex: none; box-shadow: 0 0 8px var(--cyan); }
.toast small { display: block; color: var(--dim); font-size: 12px; }
.monitor { position: absolute; left: max(10px, env(safe-area-inset-left)); bottom: max(10px, env(safe-area-inset-bottom)); width: min(460px, 70vw); max-height: 30vh; overflow: hidden; margin: 0;
  padding: 8px 10px; background: rgba(0, 0, 0, .62); border-left: 2px solid var(--cyan); font: 11px/1.45 var(--mono); color: #b9c6d4; white-space: pre-wrap; word-break: break-word; pointer-events: none; }
.monitor b { color: #78f8a0; font-weight: 500; }
.touch { position: absolute; left: 0; right: 0; bottom: 0; display: none; justify-content: space-between; align-items: flex-end; gap: 12px;
  padding: 0 max(16px, env(safe-area-inset-right)) max(18px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); pointer-events: none; touch-action: none; user-select: none; -webkit-user-select: none; }
.touch.on { display: flex; }
.touch button { pointer-events: auto; font: 700 15px var(--display); color: var(--ink); background: rgba(255, 255, 255, .1); border: 1px solid rgba(255, 255, 255, .28);
  border-radius: 12px; min-width: 56px; min-height: 56px; -webkit-tap-highlight-color: transparent; backdrop-filter: blur(4px); }
.touch button.held { background: rgba(91, 209, 245, .35); border-color: var(--cyan); }
.dpad { display: grid; grid-template-columns: repeat(3, 56px); grid-template-rows: repeat(3, 56px); gap: 4px; }
@media (orientation: landscape) and (max-height: 520px) {
  .touch { align-items: center; bottom: 50%; transform: translateY(50%); padding-bottom: 0; }
  .dpad { grid-template-columns: repeat(3, 52px); grid-template-rows: repeat(3, 52px); }
  .touch button { min-width: 52px; min-height: 52px; } }
.dpad [data-k="up"] { grid-area: 1 / 2; } .dpad [data-k="left"] { grid-area: 2 / 1; } .dpad [data-k="right"] { grid-area: 2 / 3; } .dpad [data-k="down"] { grid-area: 3 / 2; }
.ab { display: grid; grid-template-columns: 64px 64px; grid-template-rows: 30px 64px 64px; gap: 8px 12px; align-items: end; }
.ab [data-k="start"] { grid-area: 1 / 1 / 2 / 3; min-height: 30px; border-radius: 15px; font-size: 12px; letter-spacing: .12em; }
.ab [data-k="b"] { grid-area: 3 / 1; border-radius: 50%; } .ab [data-k="a"] { grid-area: 2 / 2; border-radius: 50%; background: rgba(150, 90, 220, .3); }
.ab [data-k="opts"] { grid-area: 3 / 2; border-radius: 50%; font: 22px/1 system-ui, sans-serif; background: rgba(255, 255, 255, .05); }
@media (prefers-reduced-motion: reduce) { .toast { transition: none; } }
</style>

<div class="stage" id="stage">
  <canvas id="screen" width="320" height="224" tabindex="0" aria-label="Prismheart game screen"></canvas>
  <div class="touch" id="pad" aria-label="Touch controls">
    <div class="dpad">
      <button data-k="up" aria-label="Up">&#9650;</button><button data-k="left" aria-label="Left">&#9664;</button>
      <button data-k="right" aria-label="Right">&#9654;</button><button data-k="down" aria-label="Down">&#9660;</button>
    </div>
    <div class="ab">
      <button data-k="start" aria-label="Start, field menu">START</button>
      <button data-k="a" aria-label="A, confirm">A</button>
      <button data-k="b" aria-label="B, back">B</button>
      <button data-k="opts" aria-label="Settings" class="gear">&#9881;</button>
    </div>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"><i></i><div></div></div>
  <pre class="monitor" id="log" hidden></pre>
  <div class="boot" id="status">LOADING PRISMHEART&hellip;</div>
</div>

<script src="settings/daedalus-settings.js"></script>
<script src="summons.js"></script>

<script>
"use strict";
(() => {
const cv = document.getElementById("screen"), g = cv.getContext("2d");
g.imageSmoothingEnabled = false;
let W = 320, H = 224;
const T = 16;
const statusEl = document.getElementById("status"), logEl = document.getElementById("log");
let D, IM = {};
const rnd = (a, b) => a + Math.random() * (b - a);
const ri = (a, b) => Math.floor(rnd(a, b + 1));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

/* ---------- scaling: the largest sharp scale that fits the window (fractional only below 2x) ---------- */
const stageEl = document.getElementById("stage"), touchEl = document.getElementById("pad"), toastEl = document.getElementById("toast");
function touchOn() {
  const mode = SETTINGS && SETTINGS.loaded() && SETTINGS.row("TouchControls") ? SETTINGS.get("TouchControls") : 0;   /* 0 AUTO, 1 ON, 2 OFF */
  return mode === 1 || (mode === 0 && window.matchMedia && matchMedia("(pointer: coarse)").matches);
}
function fit() {
  const vw = window.innerWidth || 1024, vh = window.innerHeight || 768, touch = touchOn(), portrait = vh > vw;
  touchEl.classList.toggle("on", touch);
  stageEl.classList.toggle("portrait-touch", touch && portrait);
  const pads = touch ? touchEl.getBoundingClientRect() : null;
  const ctlH = touch && portrait ? 270 : 0, side = touch && !portrait ? 196 : 0;   /* room the touch controls need */
  const availH = vh - ctlH, availW = vw - 2 * side;
  let k = Math.min(availW / W, availH / H);
  if (k >= 2) k = Math.floor(k);
  const ch = Math.floor(H * k);
  cv.style.width = Math.floor(W * k) + "px"; cv.style.height = ch + "px";
  stageEl.style.paddingTop = touch && portrait ? Math.max(10, (availH - ch) / 2) + "px" : "";
}
window.addEventListener("resize", fit);

/* ---------- input ----------
   Every source (keyboard, touch pad, each controller, the test hook) holds its own buttons; a logical button is held
   while any source holds it and is released only when the last one lets go (the native portal-controls translator's
   rule, so a pad release never cancels a key that is still down). */
const LOGICAL = ["up", "down", "left", "right", "a", "b", "start"];
const held = {}, pressed = {}, pressedAt = {}, SRC = {}, repeatAt = {};
function setHeld(src, k, v) {
  (SRC[src] = SRC[src] || {})[k] = !!v;
  const was = !!held[k];
  held[k] = Object.values(SRC).some(o => o[k]);
  if (held[k] && !was) { pressed[k] = true; pressedAt[k] = performance.now(); repeatAt[k] = pressedAt[k] + 380; }
}
function releaseSource(src) { if (SRC[src]) for (const k of LOGICAL) setHeld(src, k, false); delete SRC[src]; }
const KEYMAP = { ArrowUp: "up", KeyW: "up", ArrowDown: "down", KeyS: "down", ArrowLeft: "left", KeyA: "left", ArrowRight: "right", KeyD: "right",
  KeyZ: "a", Space: "a", KeyX: "b", Escape: "b", Backspace: "b", Enter: "start" };
window.addEventListener("keydown", e => {
  if (settingsTransition || (typeof PANEL !== "undefined" && PANEL && PANEL.isOpen())) return;
  if (PAD && PAD.binding() && e.code === "Escape") { e.preventDefault(); return PAD.cancelBind(); }
  const k = KEYMAP[e.code]; if (!k) return; e.preventDefault(); if (!e.repeat) setHeld("kb", k, true); unlockAudio();
});
window.addEventListener("keyup", e => { const k = KEYMAP[e.code]; if (k) setHeld("kb", k, false); });
window.addEventListener("blur", () => Object.keys(SRC).forEach(releaseSource));     /* focus loss releases everything held */
document.querySelectorAll("#pad button").forEach(b => {
  const k = b.dataset.k;
  const down = e => { e.preventDefault(); if (settingsTransition || (PANEL && PANEL.isOpen())) return; if (k === "opts") { openSettings(); return; } setHeld("touch", k, true); b.classList.add("held"); unlockAudio(); };
  const up = e => { e.preventDefault(); setHeld("touch", k, false); b.classList.remove("held"); };
  b.addEventListener("pointerdown", down); b.addEventListener("pointerup", up); b.addEventListener("pointerleave", up); b.addEventListener("pointercancel", up);
});
cv.addEventListener("pointerdown", () => { cv.focus(); unlockAudio(); });
const hit = k => { const v = pressed[k]; pressed[k] = false; return !!v; };
/* A mode transition consumes this press, while held sources and movement buffering stay intact. */
function clearActionButtons() { for (const k of ["a", "b", "start"]) hit(k); }
function menuRepeat(now) {                                        /* held directions repeat in menus, never in the field */
  if (mode === "field" && !dlg) return;
  for (const k of ["up", "down", "left", "right"]) if (held[k] && now >= (repeatAt[k] || Infinity)) { pressed[k] = true; repeatAt[k] = now + 110; }
}

/* ---------- controllers: the shared DaedalusPad module (controllers/daedalus-pad.js + controller-bundle.json) ----------
   Standard pads, the community-mapped retro / arcade / adapter database, BIND for anything else, the one-button
   rule for Atari sticks, MAME keys for cabinet encoders. The demo only translates its logical actions. */
/* ---------- settings: the shared DaedalusSettings module and its Halo Infinite-style panel ---------- */
const SETTINGS = window.DaedalusSettings ? DaedalusSettings.create({ schema: "settings/settings-schema.json" }) : null;
if (SETTINGS) SETTINGS.on("*", () => applyAudio());
const PAD_TO_DEMO = { up: "up", down: "down", left: "left", right: "right", confirm: "a", cancel: "b", menu: "start" };
const PAD = window.DaedalusPad ? DaedalusPad.create({
  bundle: "controllers/controller-bundle.json", arcadeKeys: true, storageKey: "prism.pad.v2", settings: SETTINGS,
  onChange: e => {
    if (e.type === "down" || e.type === "up") {
      if (settingsTransition || (PANEL && PANEL.isOpen())) return;   /* the panel reads the pad itself */
      if (e.action === "select" && e.type === "down") { openSettings(); return; }
      const k = PAD_TO_DEMO[e.action]; if (k) setHeld("pad", k, e.type === "down"); if (e.type === "down") unlockAudio(); return;
    }
    if (e.type === "bind" && e.step) sfx("TICK");
    if (e.type === "bound") { sfx("PICK"); toast("Buttons taught", e.pad.name); }
    if (e.type === "connect") toast(e.pad.name + " connected", e.pad.source === "guess" ? "Unknown layout: Settings > Controller > Teach Buttons" : "Ready. View / Select opens Settings.");
    if (e.type === "disconnect") toast(e.pad.name + " disconnected");
  },
}) : null;
let settingsTransition = false, settingsFramePaused = false;
function clearSettingsInput() {
  Object.keys(SRC).forEach(releaseSource); LOGICAL.forEach(hit);
  settingsTransition = true;                              /* the panel's closing choice never becomes a game action */
}
const PANEL = SETTINGS && window.DaedalusSettings ? DaedalusSettings.mountPanel({ settings: SETTINGS, pad: PAD,
  onOpen: clearSettingsInput, onClose: () => { clearSettingsInput(); cv.focus({ preventScroll: true }); } }) : null;
/* A small notice in the corner: a controller arriving or leaving, a save, a bind finished. */
let toastTimer = 0;
function toast(title, sub) {
  toastEl.querySelector("div").innerHTML = "";
  const t = document.createElement("div"); t.textContent = title; toastEl.querySelector("div").appendChild(t);
  if (sub) { const s2 = document.createElement("small"); s2.textContent = sub; toastEl.querySelector("div").appendChild(s2); }
  toastEl.classList.add("on"); clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove("on"), 3800);
}
function openSettings() { if (PANEL && !PANEL.isOpen()) { Object.keys(SRC).forEach(releaseSource); PANEL.open(); } }

/* This demo's own rows in the shared tabs: controllers (shared helper), touch controls, the jukebox monitor, keys, save. */
if (SETTINGS) {
  DaedalusSettings.addPadRows(SETTINGS, PAD);
  SETTINGS.extend({ tab: "CONTROLLER", section: "Touch", rows: [
    { id: "TouchControls", kind: "choice", label: "Touch Controls", choices: ["AUTO", "ON", "OFF"], default: 0, max: 2,
      help: "The on-screen d-pad and buttons. Auto shows them on touch screens only." }] });
  SETTINGS.extend({ tab: "KEYBOARD/MOUSE", section: "Keys", rows: [
    { id: "KeysGame", kind: "info", label: "Keyboard", value: "Arrows / WASD move\nZ or Space: A   X or Esc: B\nEnter: Start (field menu)\nF1: Settings",
      help: "Move with the arrow keys or WASD. Z or Space confirms and talks, X or Esc goes back, Enter opens the field menu, F1 opens these settings." },
    { id: "KeysArcade", kind: "info", label: "Arcade Encoders", value: "Left Ctrl: A   Left Alt: B\n1: Start   5: Select",
      help: "Cabinets wired as keyboards (I-PAC, X-Arcade mode 1) send MAME's default keys; they work as a controller here." }] });
  SETTINGS.extend({ tab: "AUDIO", section: "Jukebox", rows: [
    { id: "JukeboxMonitor", kind: "toggle", label: "Jukebox Monitor", default: 0,
      help: "Show the {cue, changed, sfx} messages the realm sends to the touring jukebox (ADR-052), in the corner of the screen." },
    { id: "JukeboxNow", kind: "info", label: "Now Playing", value: () => (juke.cue ? juke.cue + " cue" : "Silent") + (actx ? "" : " (press a button to start sound)"),
      help: "The jukebox cue the realm asked for last. The same cue never restarts its song." }] });
  SETTINGS.extend({ tab: "GAMEPLAY", section: "Saved Game", rows: [
    { id: "SaveInfo", kind: "info", label: "Journey", value: () => saveSummary(), help: "Rest at an inn or choose SAVE in the field menu outside a dungeon to record your journey. CONTINUE on the title screen resumes it." },
    { id: "SaveErase", kind: "action", label: "Erase Saved Journey", button: "ERASE", help: "Forget the saved journey. Rest at an inn or choose SAVE in the field menu outside a dungeon to enable CONTINUE again." }] });
  SETTINGS.onAction("SaveErase", eraseSavedJourney);
  SETTINGS.on("TouchControls", () => fit());
  SETTINGS.on("JukeboxMonitor", v => { logEl.hidden = !v; });
}

/* ---------- jukebox (ADR-052 cue contract) ---------- */
const AC = window.AudioContext || window.webkitAudioContext;
let actx = null, master, musicGain, sfxGain, voiceGain, lim = null, musicSrc = null, curBufCue = null;
/* Audio tab (shared settings): Main, Voice (dialogue blips), Music, Menu Music (title), Sound Effects, Dynamic Range,
   Inactive Mute. Levels are read every time they are applied, so the panel's sliders take effect at once. */
const vol = id => (SETTINGS && SETTINGS.loaded() ? SETTINGS.get(id) : { MainVolume: 80, VoiceVolume: 100, MusicVolume: 60, MenuMusicVolume: 60, EffectsVolume: 80, InactiveMute: 1, DynamicRange: 0 }[id]) ;
const musicLevel = () => 1.1 * vol(juke.cue === "TITLE" ? "MenuMusicVolume" : "MusicVolume") / 100;
function applyAudio() {
  if (!actx) return;
  const t = actx.currentTime, hidden = vol("InactiveMute") && document.hidden;
  master.gain.setTargetAtTime(hidden ? 0 : vol("MainVolume") / 100, t, 0.05);
  musicGain.gain.setTargetAtTime(musicLevel(), t, 0.05);
  sfxGain.gain.setTargetAtTime(vol("EffectsVolume") / 100, t, 0.05);
  voiceGain.gain.setTargetAtTime(vol("VoiceVolume") / 100, t, 0.05);
  const night = vol("DynamicRange") === 1;               /* Compressed: evens loud and quiet out (late nights, small speakers) */
  lim.threshold.setTargetAtTime(night ? -28 : -10, t, 0.05); lim.ratio.setTargetAtTime(night ? 6 : 20, t, 0.05);
  lim.knee.setTargetAtTime(night ? 18 : 0, t, 0.05);
}
document.addEventListener("visibilitychange", applyAudio);
const bufs = {};
const juke = { cue: null, lastPosted: null, sfx: [], posts: 0 };
function unlockAudio() {
  if (actx && actx.state === "suspended") actx.resume().catch(() => {});
  if (actx || !AC) return;
  try {
    actx = new AC();
    lim = actx.createDynamicsCompressor();                /* ear-safety limiter, like rd-jukebox's fixed chain */
    lim.threshold.value = -10; lim.ratio.value = 20; lim.attack.value = 0.001; lim.release.value = 0.12;
    master = actx.createGain(); musicGain = actx.createGain(); sfxGain = actx.createGain(); voiceGain = actx.createGain();
    musicGain.connect(lim); sfxGain.connect(lim); voiceGain.connect(lim); lim.connect(master); master.connect(actx.destination);
    applyAudio();
    if (juke.cue) startMusic(juke.cue);
  } catch (e) { actx = null; }
}
async function buffer(url) {
  if (!actx) return null;
  if (bufs[url]) return bufs[url];
  bufs[url] = fetch(url).then(r => r.arrayBuffer()).then(a => new Promise((ok, bad) => actx.decodeAudioData(a, ok, bad))).catch(() => null);
  return bufs[url];
}
async function startMusic(cue) {
  if (!actx) return;
  const url = D.audio.cues[cue]; if (!url) return;
  const want = cue; curBufCue = cue;
  const b = await buffer(url);
  if (!b || curBufCue !== want) return;
  const now = actx.currentTime;
  if (musicSrc) { const old = musicSrc; old.gainNode.gain.setTargetAtTime(0, now, 0.15); setTimeout(() => { try { old.stop(); } catch (e) {} }, 900); }
  const src = actx.createBufferSource(); src.buffer = b;
  const loop = D.audio.loops[cue];
  if (loop) { src.loop = true; src.loopStart = 0; src.loopEnd = Math.min(loop, b.duration); }
  const gn = actx.createGain(); gn.gain.setValueAtTime(0, now); gn.gain.setTargetAtTime(1, now, 0.12);
  src.connect(gn); gn.connect(musicGain); src.gainNode = gn; src.start(); musicSrc = src;
}
async function playSfx(ev) {
  if (!actx) return;
  const url = D.audio.events[ev]; if (!url) return;
  const b = await buffer(url); if (!b) return;
  const voice = ev.startsWith("BLIP:");                  /* dialogue blips are the realm's voices */
  const s = actx.createBufferSource(); s.buffer = b; s.connect(voice ? voiceGain : sfxGain); s.start();
  if (!voice) {                                          /* duck the music under effects */
    const t = actx.currentTime, lv = musicLevel(); musicGain.gain.cancelScheduledValues(t);
    musicGain.gain.setTargetAtTime(lv * 0.6, t, 0.02); musicGain.gain.setTargetAtTime(lv, t + b.duration, 0.12);
  }
}
function cue(c) { juke.cue = c; }
const RUMBLE = { HURT: [0.45, 110], CRIT: [0.7, 150], ZAP: [1, 420], DEFEAT: [0.8, 600], CALL: [0.6, 300] };
function sfx(e) { juke.sfx.push(e); if (RUMBLE[e] && PAD) PAD.rumble(RUMBLE[e][0], RUMBLE[e][1]); }
function jukeTick() {
  const changed = juke.cue !== juke.lastPosted;
  if (!changed && !juke.sfx.length) return;
  const body = { cue: juke.cue, changed, sfx: juke.sfx.splice(0) };
  juke.posts++;
  if (changed) { juke.lastPosted = juke.cue; startMusic(juke.cue); applyAudio(); }
  body.sfx.forEach(playSfx);
  const line = document.createElement("div");
  line.innerHTML = "<b>POST</b> " + JSON.stringify(body).replace(/</g, "&lt;");
  logEl.prepend(line); while (logEl.childNodes.length > 40) logEl.removeChild(logEl.lastChild);
}

/* ---------- drawing helpers ---------- */
const CHARS = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789 .,:!?/-'>+_";
const fontCache = {};
function fontFor(color) {
  if (fontCache[color]) return fontCache[color];
  const r = D.rects.sprites["ui:Font_5x7"], c = document.createElement("canvas");
  c.width = r[2]; c.height = r[3]; const x = c.getContext("2d");
  x.drawImage(IM.sprites, r[0], r[1], r[2], r[3], 0, 0, r[2], r[3]);
  x.globalCompositeOperation = "source-in"; x.fillStyle = color; x.fillRect(0, 0, r[2], r[3]);
  return (fontCache[color] = c);
}
function text(s, x, y, color = "#ffffff", shadow = "#202040") {
  s = String(s).toUpperCase();
  for (const [col, dx] of shadow ? [[shadow, 1], [color, 0]] : [[color, 0]]) {
    const f = fontFor(col);
    for (let i = 0; i < s.length; i++) {
      const k = CHARS.indexOf(s[i]); if (k < 0 || s[i] === " ") continue;
      g.drawImage(f, (k % 16) * 6, Math.floor(k / 16) * 8, 5, 7, x + i * 6 + dx, y + dx, 5, 7);
    }
  }
}
const tw = s => String(s).length * 6;
function spr(sheet, name, x, y, sx = 0, sw, sh, scale = 1) {
  const r = D.rects[sheet][name]; if (!r) return;
  sw = sw || r[2]; sh = sh || r[3];
  g.drawImage(IM[sheet], r[0] + sx, r[1], sw, sh, Math.round(x), Math.round(y), Math.round(sw * scale), Math.round(sh * scale));
}
function win(x, y, w, h) {
  const r = D.rects.sprites["ui:Window_9slice"], c = 8, s = r[2];
  const parts = [[0, 0, c, c, x, y, c, c], [c, 0, s - 2 * c, c, x + c, y, w - 2 * c, c], [s - c, 0, c, c, x + w - c, y, c, c],
    [0, c, c, s - 2 * c, x, y + c, c, h - 2 * c], [c, c, s - 2 * c, s - 2 * c, x + c, y + c, w - 2 * c, h - 2 * c], [s - c, c, c, s - 2 * c, x + w - c, y + c, c, h - 2 * c],
    [0, s - c, c, c, x, y + h - c, c, c], [c, s - c, s - 2 * c, c, x + c, y + h - c, w - 2 * c, c], [s - c, s - c, c, c, x + w - c, y + h - c, c, c]];

  clock: () => ({ day: state.day, minute: state.minute, phase: phase(), dark: dark(), text: clockText() }),
  setClock: (day, minute) => { state.day = day; state.minute = minute; },
  fishOdds: n => { const c = {}; for (let i = 0; i < n; i++) { const f = pickFish(); c[f.name] = (c[f.name] || 0) + 1; } return c; },
  recoverAir: saved => recoverAir(saved),
  shop: () => shop && { kind: shop.kind, tab: shop.tab, idx: shop.idx, msg: shop.msg, sell: shop.tab === "sell" ? sellList().map(k => [k, bag[k], sellPrice(k)]) : null },
  skyCaches: () => (D.sky_caches || []).map(c => Object.assign({ opened: opened.has(skyKey(c)) }, c)),
  airship: () => D && map && map.kind === "world" ? Object.assign({ unlocked: airUnlocked(), flying: flying() }, airship()) : { unlocked: airUnlocked(), saved: state.air },
};

/* ---------- boot ---------- */
function img(src) { return new Promise((ok, bad) => { const i = new Image(); i.onload = () => ok(i); i.onerror = () => bad(new Error("could not load " + src)); i.src = src; }); }
async function boot() {
  fit();
  try {
    D = await (await fetch("data.json")).json();
    // Realm projection only: keep the shared engine and other owners' load hooks.
    if (D.realm_profile) {
      W = D.screen[0]; H = D.screen[1]; cv.width = W; cv.height = H; g.imageSmoothingEnabled = false;
      SAVE_KEY = D.realm_profile.save_key;
      document.title = D.realm + " Playable Demo"; cv.setAttribute("aria-label", D.realm + " game screen");
      Object.assign(LINES, D.realm_profile.dialogue);
    }
    [IM.tiles, IM.sprites, IM.backdrops, IM.spells, IM.title] = await Promise.all(["tiles.png", "sprites.png", "backdrops.png", "spells.png", "title.png"].map(img));
  } catch (e) { statusEl.textContent = "The demo files did not load: " + e.message; return; }
  statusEl.hidden = true;
  cue("TITLE"); fit(); cv.focus({ preventScroll: true });
  requestAnimationFrame(frame);
}

window.addEventListener("keydown", e => {
  if (!PANEL || settingsTransition || PANEL.isOpen()) return;
  if (e.code === "F1" || e.code === "F10" || (e.code === "Escape" && mode === "title")) { e.preventDefault(); openSettings(); }
});

boot();
})();
</script>
