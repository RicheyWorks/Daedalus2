   REACTION / DIFFUSION / SONG
   Gray-Scott reaction-diffusion (after Richey RICH's Processing sketch)
   + fully synthesized, simulation-driven music. No samples, no libraries.
   Input: a 32-byte token hash from ?hash=0x.. , #0x.. , or window.tokenData.hash
   Hash 0x0 (all zeros) = GENESIS = Richey's exact original sketch.
   ===================================================================== */

// ---------------------------------------------------------- hash + PRNG
function readHash(){
  let h=null;
  try{ if(window.tokenData&&tokenData.hash) h=String(tokenData.hash); }catch(e){}
  const qs=new URLSearchParams(location.search);
  if(!h&&qs.get('hash')) h=qs.get('hash');
  if(!h&&location.hash.length>1) h=decodeURIComponent(location.hash.slice(1));
  if(!h) h='0x0';
  h=h.trim().toLowerCase(); if(!h.startsWith('0x')) h='0x'+h;
  let hex=h.slice(2).replace(/[^0-9a-f]/g,'');
  if(hex.length===0) hex='0';
  hex=hex.length>64?hex.slice(0,64):hex.padStart(64,'0');
  return '0x'+hex;
}
function sfc32(a,b,c,d){return function(){a>>>=0;b>>>=0;c>>>=0;d>>>=0;let t=(a+b)|0;a=b^(b>>>9);b=(c+(c<<3))|0;c=(c<<21)|(c>>>11);d=(d+1)|0;t=(t+d)|0;c=(c+t)|0;return (t>>>0)/4294967296;};}
function rngFromHash(hash,salt){
  const h=hash.slice(2); const p=[];
  for(let i=0;i<4;i++) p.push((parseInt(h.substr(i*8,8),16)^parseInt(h.substr(32+i*8,8),16)^Math.imul(salt|0,0x9E3779B1+i*0x85EBCA6B))>>>0);
  const r=sfc32(p[0],p[1],p[2],p[3]); for(let i=0;i<24;i++) r(); return r;
}

function pick(r,arr){let t=0;for(const a of arr)t+=a.w;let x=r()*t;for(const a of arr){x-=a.w;if(x<0)return a;}return arr[arr.length-1];}
function pickBias(r,arr,bias){return pick(r,arr.map(a=>Object.assign({},a,{w:a.w*((bias&&bias[a.name]!==undefined)?bias[a.name]:1)})));}

function deriveTraits(hash){
  const R=rngFromHash(hash,1);
  let P={};
  if(IS_GENESIS){
    P={regime:REGIMES[8],grain:{name:'Original',s:1},seeding:'Monolith',seeds:1,symmetry:'None',palette:PALETTES[10],
       key:2,mode:MODES[0],tempo:72,ensemble:'Hybrid',lead:'Glass Bell',density:DENSITIES[1],cave:CAVES[1],genesisExact:true,
       complexity:'Genesis',field:'Uniform',boundary:'Open',flow:'None',growth:'Still',render:'Flat',symbiont:false,harmony:'Modal',travel:'Fixed',morph:'None',current:'Still Water',warp:'None',pathType:'Regimes'};
  }else{
    const V=rngFromHash(hash,2);                     // visual-structure stream
    P.complexity=pick(V,COMPLEXITY).name; const C=P.complexity;
    P.regime=pickBias(R,REGIMES,REGIME_BIAS[C]);
    P.grain=P.regime.genesis?{name:'Original',s:1}:pickBias(V,SCALES,SCALE_BIAS[C]);
    P.seeding=pick(R,SEEDINGS).name;
    P.symmetry=pick(R,SYMMETRIES).name;
    P.palette=pick(R,PALETTES);
    P.key=Math.floor(R()*12);
    P.mode=pick(R,MODES);
    P.tempo=pick(R,TEMPOS).v;
    P.ensemble=pick(R,ENSEMBLES).name;
    const L=LEADS[P.ensemble]; P.lead=L[Math.floor(R()*L.length)];
    P.density=pick(R,DENSITIES);
    P.cave=pick(R,CAVES);
    P.harmony=pick(V,HARMONIES).name;
    P.goldenN=P.harmony==='Golden Ratio'?(V()<.5?5:8):0;
    if(P.regime.genesis){ // Genesis Moiré tokens keep Richey's kernel untouched
      Object.assign(P,{field:'Uniform',boundary:'Open',flow:'None',growth:'Still',render:'Flat',symbiont:false,morph:'None',current:'Still Water',warp:'None',pathType:'Regimes'});
    }else{
      P.field=pick(V,FIELDS[C]).name;
      P.boundary=pick(V,BOUNDARIES[C]).name;
      if(P.grain.macro&&/Islands|Phyllotaxis|Single|Glyph|Rose|L-System|Automaton|Life|Truchet|Pentagrid|Tree|Gabriel|Hex/.test(P.boundary))P.grain=SCALES[3]; // small shapes need a finer wavelength than Macro
      P.flow=pick(V,FLOWS[C]).name;
      P.current=P.flow==='None'?'Still Water':pick(V,CURRENTS[C]).name;
      P.warp=/Linear|Petals|Spiral|Terrain|Bands/.test(P.field)?pick(V,WARPS).name:'None';
      P.pathType=(P.field!=='Uniform'&&P.field!=='Zoom'&&V()<.3)?'Pearson Loop':'Regimes';
      P.growth=pick(V,GROWTHS[C]).name;
      P.render=pick(V,RENDERS[C]).name;
      P.symbiont=V()<SYMBIONT_P[C];
      if(P.render==='Line Art'||P.render==='Halftone')P.symbiont=false;
      // chiral / directional flows cannot keep a mirror symmetry: the token becomes asymmetric
      if(P.symmetry!=='None'&&(!/^(None|Vortex|Radiant)$/.test(P.flow)||P.boundary==='Golden Spiral'))P.symmetry='None';
      if(P.symmetry!=='None')P.current='Still Water';
      if(P.boundary!=='Open'||P.grain.s>=1)P.current='Still Water';   // currents wash bounded colonies out of their shape, and Bold/Macro grains have no stability margin left
      // the Pearson path: 2-3 regimes (+ optional fade to Void)
      const others=REGIMES.filter(r=>!r.genesis&&r!==P.regime);
      const path=[P.regime];
      const nStops=(P.field==='Uniform'||P.field==='Zoom')?2:(C==='Chaotic'||(C==='Intricate'&&V()<.45))?3:2;
      while(path.length<nStops){const o=others.splice(Math.floor(V()*others.length),1)[0];path.push(o);}
      P.void=(P.field!=='Uniform'&&P.field!=='Zoom'&&V()<(C==='Balanced'?.3:C==='Simple'?.4:.15));
      if(/Pentagrid|Gabriel|Spanning|L-System|Truchet|Cellular|Life/.test(P.boundary))P.void=false; // thin channels + a fade to Void leave nothing alive
      P.path=path;
      P.morph=(P.field==='Uniform'||P.field==='Zoom')?'None':path.slice(1).map(r=>r.name).join(' → ')+(P.void?' → Void':'');
      if(P.pathType==='Pearson Loop'){ // closed parametric curve through the (F,k) map; its shape comes from a Collatz orbit
        P.collatzN=(parseInt(hash.slice(-6),16)%9973)+2; P.collatz=collatzSteps(P.collatzN);
        P.loopM=1+(P.collatz%4); P.loopPh=(P.collatz%13)/13; P.void=false;
        P.morph='Loop ×'+P.loopM;}
    }
    P.travel=P.harmony==='Circle of Fifths'?'Fifths':P.harmony==='Circle of Fourths'?'Fourths':(P.field!=='Uniform'?'Dominant Sway':'Fixed');
    P.V=V;
  }
  P.R=R;
  return P;
}

const W=GEN?800:MACRO?200:400, H=W;
const FANCY=!GEN&&(P.field!=='Uniform'||P.boundary!=='Open'||P.flow!=='None');
const WRAP=!GEN&&!FANCY;                     // periodic for plain tokens; reflecting walls when the canvas has structure
const FEED=P.regime.f, KILL=P.regime.k;
const DA=GEN?2.0:1.0*P.grain.s, DB=GEN?1.5:0.5*P.grain.s;
let A=new Float32Array(W*H), B=new Float32Array(W*H);

A.fill(1);
const XM=new Int32Array(W),XP=new Int32Array(W),YM=new Int32Array(H),YP=new Int32Array(H);
for(let x=0;x<W;x++){XM[x]=WRAP?(x-1+W)%W:Math.max(0,x-1);XP[x]=WRAP?(x+1)%W:Math.min(W-1,x+1);}
for(let y=0;y<H;y++){YM[y]=WRAP?(y-1+H)%H:Math.max(0,y-1);YP[y]=WRAP?(y+1)%H:Math.min(H-1,y+1);}

// ---- per-cell parameter fields (non-genesis): path position, kill boost (boundary mask), diffusion scale, anisotropy
const NL=512; const LF=new Float32Array(NL), LK=new Float32Array(NL), LV=new Float32Array(NL); // path LUT over pos in [-0.5,1.5]

function smooth(a,b,x){const t=Math.min(1,Math.max(0,(x-a)/(b-a)));return t*t*(3-2*t);}
function makeNoise(R,n){const g=new Float32Array((n+1)*(n+1));for(let i=0;i<g.length;i++)g[i]=R();for(let j=0;j<=n;j++){g[j*(n+1)+n]=g[j*(n+1)];g[n*(n+1)+j]=g[j];} // periodic lattice
  return (u,v)=>{u=((u*n)%n+n)%n;v=((v*n)%n+n)%n;const i=Math.floor(u),j=Math.floor(v),fu=u-i,fv=v-j,su=fu*fu*(3-2*fu),sv=fv*fv*(3-2*fv);
    const a=g[j*(n+1)+i],b=g[j*(n+1)+i+1],c=g[(j+1)*(n+1)+i],d=g[(j+1)*(n+1)+i+1];return a+(b-a)*su+(c-a)*sv+(a-b-c+d)*su*sv;};}

P.snd=deriveSound(P,HASH,TOKEN_ID);

// ---------------------------------------------------------- run loop
const LIVE_SPF=GEN?2:12;   // sim steps per animation frame (even, so period-2 flicker cancels in metrics)
const mrng=rngFromHash(HASH,7);
let music=null, actx=null, settleR=rngFromHash(HASH,11);

function frame(spf){
  for(let i=0;i<spf;i++)step(); stepCount+=spf;
  const m=measure(spf);
  if(m.act<.08&&stepCount>600){quiet+=spf;} else quiet=0;
  if(quiet>QUIET_LIMIT){rainDrop(settleR);quiet=0;}

const RENDER=new URLSearchParams(location.search).has('render');
window.RD={
  frame:(spf)=>{const m=frame(spf||LIVE_SPF*2);return {mass:m.mass,act:m.act,growth:m.growth,cx:m.cx,cy:m.cy,spread:m.spread,pts:m.pts};},
  run:(steps)=>{for(let i=0;i<steps;i+=2){step();step();} stepCount+=steps; draw();},

const ov=document.getElementById('ov');
