<!DOCTYPE html>
<!-- SPDX-License-Identifier: MIT
     Daedalus Realm (ADR-018): the WebGL world client. A fourth client beside the maze well at /,
     the JavaFX desktop and explore. It reads the same REST world surface and listens on the same
     STOMP world topic, so two browsers on this page see each other's cubes land. Vanilla JS and
     an import map — no build step, matching the well. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Daedalus Realm</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.6.1/sockjs.min.js"
        integrity="sha384-svdnwiXBL+Js+yUneJSRFy24NgGiOfDM/vkQl/vCeVrcbYD6yW8EwPr1FnxTEZsR"
        crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"
        integrity="sha384-clKAk7WaYNQiu/pGVWisoFQcSK2VL7YweoI1gim9/HFbMsRvD2ZtLWNoZoL4df65"
        crossorigin="anonymous"></script>
<script type="importmap">
{ "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
    "ethers": "https://cdn.jsdelivr.net/npm/ethers@6.17.0/dist/ethers.min.js"
} }
</script>
<style>
  :root {
    --bg: #0c0908; --panel: rgba(22, 18, 14, 0.86); --line: rgba(184, 133, 56, 0.28);
    --text: #f2ead8; --dim: #b09a72; --gold: #f5c14a; --accent: #3ee08f; --warn: #ff5a5f;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; overflow: hidden;
    -webkit-user-select: none; user-select: none; touch-action: none; }
  #view { position: fixed; inset: 0; display: block; }
  .panel { position: fixed; background: var(--panel); border: 1px solid var(--line);
    border-radius: 12px; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
  #top { top: 12px; left: 12px; padding: 10px 14px; max-width: min(420px, calc(100vw - 24px)); }
  #top h1 { margin: 0; font-size: 17px; letter-spacing: .08em; color: var(--gold); }
  #status { margin-top: 4px; color: var(--dim); font-size: 12px; }
  #status .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%;
    background: var(--warn); margin-right: 6px; vertical-align: middle; }
  #status .dot.on { background: var(--accent); }
  #modes { top: 12px; right: 12px; padding: 6px; display: flex; gap: 6px; }
  #atmo { top: 76px; right: 12px; width: min(280px, calc(100vw - 24px)); padding: 12px; z-index: 5; display: none; }
  #atmo.open { display: block; }
  #atmo h2 { margin: 0 0 8px; font-size: 13px; color: var(--gold); letter-spacing: .06em; }
  #atmo label { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 8px 0;
    color: var(--dim); font-size: 12px; }
  #atmo input[type=range] { flex: 1 1 auto; accent-color: var(--gold); }
  #atmo input[type=checkbox] { width: 20px; height: 20px; accent-color: var(--gold); }
  #atmoHour { min-width: 46px; text-align: right; color: var(--text); }
  button { font: inherit; color: var(--text); background: rgba(40, 32, 24, 0.9);
    border: 1px solid var(--line); border-radius: 10px; min-height: 44px; min-width: 44px;
    padding: 0 14px; cursor: pointer; touch-action: manipulation; }
  button:hover { border-color: rgba(184, 133, 56, 0.7); }
  button.on { background: rgba(184, 133, 56, 0.28); border-color: var(--gold); color: #fff; }
  #palette { left: 50%; bottom: max(12px, env(safe-area-inset-bottom)); transform: translateX(-50%);
    padding: 6px; display: flex; gap: 6px; max-width: calc(100vw - 24px); overflow-x: auto; }
  .swatch { min-width: 52px; height: 52px; padding: 0; position: relative; }
  .swatch i { position: absolute; inset: 7px 7px 17px; border-radius: 6px;
    box-shadow: inset 0 -6px 0 rgba(0,0,0,.25); }
  .swatch span { position: absolute; left: 0; right: 0; bottom: 2px; font-size: 9px;
    color: var(--dim); text-align: center; letter-spacing: .04em; }
  .swatch.on span { color: #fff; }
  #side { touch-action: pan-y; top: 76px; right: 12px; width: min(280px, calc(100vw - 24px)); padding: 12px;
    max-height: calc(100vh - 180px); overflow-y: auto; }
  #side h2 { margin: 0 0 8px; font-size: 13px; color: var(--gold); letter-spacing: .06em; }
  #side .row { display: flex; gap: 6px; margin-bottom: 10px; }
  #side input { flex: 1; min-width: 0; min-height: 44px; font: inherit; color: var(--text);
    background: rgba(0,0,0,.35); border: 1px solid var(--line); border-radius: 10px; padding: 0 10px; }
  .isle { border-top: 1px solid var(--line); padding: 8px 0; display: flex; gap: 8px; align-items: center; }
  .isle div { flex: 1; font-size: 12px; color: var(--dim); }
  .isle b { color: var(--text); font-weight: 600; }
  #newWorldStyle, .isle select { min-height: 44px; font: inherit; color: var(--text); background: rgba(0,0,0,.35);
    border: 1px solid var(--line); border-radius: 10px; padding: 0 6px; }
  button:disabled { opacity: .45; cursor: default; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { min-height: 36px; padding: 0 10px; font-size: 12px; text-transform: capitalize; }
  .kinds { margin-top: 8px; max-height: 220px; overflow-y: auto; touch-action: pan-y; }
  .kinds .note { color: var(--dim); font-size: 12px; margin-bottom: 6px; font-style: italic; }
  .kind { font-size: 12px; padding: 4px 0; border-top: 1px solid rgba(184,133,56,.14); }
  .kind span { color: var(--dim); }
  .life { display: none; margin: 6px 0 4px; padding: 8px; border: 1px solid var(--line); border-radius: 10px;
    background: rgba(0,0,0,.25); max-height: 260px; overflow-y: auto; touch-action: pan-y; }
  .life .note { color: var(--dim); font-size: 12px; font-style: italic; }
  .life-head { font-size: 12px; color: var(--dim); margin-bottom: 6px; }
  .deed { float: right; margin: 0 0 6px 8px; }
  .deed img { display: block; width: 64px; height: 64px; border-radius: 8px; border: 1px solid var(--line); }
  .life-head b { color: var(--text); }
  .life-row { position: relative; padding-bottom: 7px; }
  .life-row i { position: absolute; left: 0; bottom: 2px; height: 3px; border-radius: 2px; opacity: .85; }
  .kinds-count, .hold { color: var(--accent); }
  .world-title { color: var(--text); font-size: 13px; margin-top: 2px; }
  .world-row .here { color: var(--accent); font-size: 12px; flex: 0 0 auto; }
  .note-line { color: var(--dim); font-size: 11px; font-style: italic; margin: -4px 0 6px; }
  .owner { padding: 0 0 8px; }
  #viewer { display: none; left: 50%; top: 50%; transform: translate(-50%, -50%); padding: 14px; z-index: 8;
    width: min(420px, calc(100vw - 32px)); text-align: center; }
  #viewer img { width: 100%; image-rendering: pixelated; border: 8px solid #2b2118; border-radius: 4px; box-sizing: border-box; }
  #viewer .v-title { color: var(--gold); font-weight: 700; margin-top: 8px; }
  #viewer .v-meta { font-size: 12px; opacity: .85; margin: 4px 0 10px; }
  #viewer .v-act { display: flex; gap: 8px; justify-content: center; }
  .hang-form .owner-act select, .hang-form .owner-act input { min-height: 44px; }
  #side .hang-form select { min-height: 44px; font: inherit; color: var(--text); background: rgba(0,0,0,.35);
    border: 1px solid var(--line); border-radius: 10px; }
  .art-preview { width: 64px; height: 64px; image-rendering: pixelated; border: 3px solid #2b2118; }
  .parcel-row.on b { color: var(--gold); }
  #stick, #jumpBtn { display: none; position: fixed; bottom: max(18px, env(safe-area-inset-bottom)); z-index: 5; }
  #stick { left: 18px; width: 120px; height: 120px; border-radius: 50%; touch-action: none; }
  #knob { position: absolute; left: 38px; top: 38px; width: 44px; height: 44px; border-radius: 50%;
    background: var(--gold); opacity: .85; pointer-events: none; }
  #jumpBtn { right: 18px; width: 96px; height: 96px; border-radius: 50%; font-weight: 700; touch-action: none; }
  body.playing #stick, body.playing #jumpBtn, body.playing .fight-btn { display: block; }
  .fight-btn { display: none; position: fixed; z-index: 5; width: 64px; height: 64px; border-radius: 50%; font-size: 24px;
    padding: 0; touch-action: none; }
  #swordBtn { right: 122px; bottom: max(30px, env(safe-area-inset-bottom)); }
  #crouchBtn { right: 30px; bottom: calc(max(18px, env(safe-area-inset-bottom)) + 104px); }
  #healBtn { right: 114px; bottom: calc(max(18px, env(safe-area-inset-bottom)) + 100px); }
  #heroHud { display: none; top: 128px; left: 12px; padding: 8px 12px; min-width: 200px; }
  #heroHud .hearts { color: #ff4d4d; font-size: 22px; letter-spacing: 2px; }
  #heroHud .magic { height: 8px; background: rgba(255,255,255,.12); border-radius: 4px; margin: 4px 0; overflow: hidden; }
  #heroHud .magic i { display: block; height: 100%; background: #4aa8ff; width: 100%; }
  #heroHud .levels, #heroHud .exp { font-size: 12px; color: var(--gold); }
  #levelUp { display: none; left: 50%; top: 22%; transform: translateX(-50%); padding: 14px; z-index: 8; text-align: center; }
  #levelUp .lu-title { color: var(--gold); font-weight: 800; letter-spacing: .2em; margin-bottom: 8px; }
  #levelUp .lu-row { display: flex; gap: 8px; margin-bottom: 8px; }
  body.playing #palette { display: none; }
  body.playing #side { display: none; }      /* the world is the screen while you play */
  .plot-grid { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 3px; margin: 4px 0 6px; }
  .plot-grid .plot { min-height: 34px; min-width: 0; width: 100%; padding: 0; font-size: 11px; border-radius: 4px;
    background: #2f6b3a; color: #e9f5e6; }
  .plot-grid .plot.owned { background: #6b5a2f; }
  .plot-grid .plot.yours { background: var(--gold); color: #1b1b1b; }
  .plot-grid .plot.on { outline: 2px solid #fff; }
  .plot-grid .plot.plaza { background: #d8d2c4; opacity: .55; }
  .owner-line { font-size: 12px; color: var(--gold); margin-bottom: 4px; }
  .owner-act { display: flex; flex-wrap: wrap; gap: 6px; }
  #side .owner-act input { flex: 1 1 100%; min-width: 0; min-height: 44px; font: inherit; color: var(--text);
    background: rgba(0,0,0,.35); border: 1px solid var(--line); border-radius: 10px; padding: 0 10px; }
  .owner-act .unlet { font-size: 12px; }
  #toast { left: 50%; top: 14px; transform: translateX(-50%); padding: 8px 14px; display: none;
    max-width: calc(100vw - 24px); }
  #login { left: 50%; top: 50%; transform: translate(-50%, -50%); padding: 16px; width: min(320px, 92vw);
    display: none; }
  #login input { width: 100%; margin: 6px 0; min-height: 44px; font: inherit; color: var(--text);
    background: rgba(0,0,0,.35); border: 1px solid var(--line); border-radius: 10px; padding: 0 10px; }
  #crosshair { position: fixed; left: 50%; top: 50%; width: 14px; height: 14px; margin: -7px 0 0 -7px;
    border: 2px solid rgba(255,255,255,.5); border-radius: 50%; pointer-events: none; display: none; }
  @media (max-width: 640px) { #side { top: auto; bottom: 84px; max-height: 38vh; } }
</style>
</head>
<body>
<canvas id="view"></canvas>
<div id="top" class="panel">
  <h1>DAEDALUS REALM</h1>
  <div id="worldTitle" class="world-title">World Zero</div>
  <div id="status"><span class="dot" id="dot"></span><span id="statusText">connecting…</span></div>
</div>
<div id="modes" class="panel">
  <button id="modeLook" class="on" title="Look (L)">Look</button>
  <button id="modeBuild" title="Build (B)">Build</button>
  <button id="modeBreak" title="Break (X)">Break</button>
  <button id="modePlay" title="Play (P)">Play</button>
  <button id="atmoBtn" title="Sky and weather (O)" aria-label="Sky and weather" aria-expanded="false">Sky</button>
</div>
<div id="atmo" class="panel" aria-label="Sky and weather">
  <h2>SKY &amp; WEATHER</h2>
  <label>Live clock <input id="atmoLive" type="checkbox" checked></label>
  <label>Time <input id="atmoTime" type="range" min="0" max="24" step="0.25" value="12" aria-label="Time of day">
    <span id="atmoHour">12:00</span></label>
  <label>Rain <input id="atmoRain" type="checkbox"></label>
  <label>Glow <input id="atmoGlow" type="checkbox" checked></label>
</div>
<div id="side" class="panel">
  <div class="row">
    <input id="me" autocomplete="nickname" placeholder="your name" aria-label="Your name">
    <button id="wallet" style="display:none">Connect wallet</button>
  </div>
  <h2>WORLDS</h2>
  <div id="worlds"></div>
  <div class="row">
    <input id="newWorldName" placeholder="new world name" aria-label="New world name" maxlength="48">
    <input id="newWorldSeed" inputmode="numeric" placeholder="seed" aria-label="New world seed" style="flex:0 0 72px">
  </div>
  <div class="row">
    <select id="newWorldStyle" aria-label="New world style" style="flex:1 1 auto;min-width:0"></select>
    <button id="newWorldGo">Create</button>
  </div>
  <div id="worldsSoon" class="note-line"></div>
  <h2 style="margin-top:14px" id="laneTitle">ISLAND LANE</h2>
  <div class="row" id="raiseRow">
    <input id="seed" inputmode="numeric" placeholder="seed" aria-label="Island seed">
    <button id="raise">Raise</button>
  </div>
  <div id="islands"></div>
  <div id="life" class="life"></div>
  <h2 style="margin-top:14px" id="arksTitle">ARKS</h2>
  <div id="arks"></div>
  <h2 style="margin-top:14px">BESTIARY</h2>
  <div id="bestiary"></div>
</div>
<div id="palette" class="panel" aria-label="Block palette"></div>
<div id="stick" class="panel" aria-label="Move"><div id="knob"></div></div>
<div id="viewer" class="panel" role="dialog" aria-label="Artwork">
  <img alt="Maze art">
  <div class="v-title"></div>
  <div class="v-meta"></div>
  <div class="v-act"><button class="v-down">Take down</button><button id="viewerClose">Close</button></div>
</div>
<button id="jumpBtn" class="panel" aria-label="Jump">Jump</button>
<button id="swordBtn" class="panel fight-btn" aria-label="Sword">⚔</button>
<button id="crouchBtn" class="panel fight-btn" aria-label="Crouch">▼</button>
<button id="healBtn" class="panel fight-btn" aria-label="Heal">✚</button>
<div id="heroHud" class="panel"><div class="hearts"></div><div class="magic"><i></i></div><div class="levels"></div><div class="exp"></div></div>
<div id="levelUp" class="panel" role="dialog" aria-label="Level up">
  <div class="lu-title">LEVEL UP</div>
  <div class="lu-row"><button data-stat="ATTACK">Attack</button><button data-stat="MAGIC">Magic</button><button data-stat="LIFE">Life</button></div>
  <button id="levelLater">Later</button>
</div>
<div id="toast" class="panel"></div>
<div id="login" class="panel">
  <h2 style="margin:0 0 6px;color:var(--gold);font-size:14px">Sign in to build</h2>
  <input id="user" autocomplete="username" placeholder="username">
  <input id="pass" type="password" autocomplete="current-password" placeholder="password">
  <div class="row" style="display:flex;gap:6px;margin-top:6px">
    <button id="loginGo" style="flex:1">Sign in</button><button id="loginCancel">Cancel</button>
  </div>
</div>
<div id="crosshair"></div>
<script type="module" src="/realm.js"></script>
</body>
</html>
