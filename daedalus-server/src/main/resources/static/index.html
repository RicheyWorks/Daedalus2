<!DOCTYPE html>
<!-- SPDX-License-Identifier: MIT
     Daedalus web UI (BACKLOG stretch goal: "lightweight frontend that subscribes to the STOMP
     topics and renders generation/solve frames in real time").

     Deliberately one file of vanilla JS — no build step, no framework, no npm. It exercises the
     public surfaces exactly as an external integrator would: the REST API for generate/solve/
     session verbs and the STOMP topics for live frames. If this page can't do something, the
     API can't either — which makes it living documentation as much as a UI.

     Works against the dev profile out of the box (permitAll, advisory STOMP auth). -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daedalus</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.6.1/sockjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
<style>
  :root {
    --bg: #101418; --panel: #1a2026; --line: #2a323b; --text: #d7dde3; --dim: #8a949e;
    --accent: #4cc38a; --accent2: #6ca0f6; --warn: #e5484d; --gold: #f0b429;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 14px/1.5 system-ui, "Segoe UI", sans-serif; }
  header { padding: 14px 20px; border-bottom: 1px solid var(--line);
           display: flex; align-items: baseline; gap: 12px; }
  header h1 { margin: 0; font-size: 18px; letter-spacing: .06em; }
  header span { color: var(--dim); font-size: 12px; }
  main { display: grid; grid-template-columns: 300px 1fr 320px; gap: 16px;
         padding: 16px 20px; align-items: start; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
           padding: 14px; }
  .panel h2 { margin: 0 0 10px; font-size: 12px; text-transform: uppercase;
              letter-spacing: .1em; color: var(--dim); }
  label { display: block; font-size: 12px; color: var(--dim); margin: 8px 0 2px; }
  select, input { width: 100%; background: var(--bg); color: var(--text);
                  border: 1px solid var(--line); border-radius: 5px; padding: 6px 8px; }
  .row { display: flex; gap: 8px; }
  button { margin-top: 10px; width: 100%; padding: 8px 10px; border-radius: 6px;
           border: 1px solid var(--line); background: #232b33; color: var(--text);
           cursor: pointer; font-weight: 600; }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #08130d; }
  button:disabled { opacity: .4; cursor: default; }
  #board { display: flex; justify-content: center; }
  canvas { border: 1px solid var(--line); border-radius: 6px; background: #161c24;
           max-width: 100%; }
  #log { height: 560px; overflow-y: auto; font: 12px/1.6 ui-monospace, monospace;
         scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
  .info { font-size: 11px; color: var(--dim); line-height: 1.45; margin-top: 4px;
          border-left: 2px solid var(--line); padding-left: 8px; }
  .info b { color: var(--text); font-weight: 600; }
  #stats { font: 12px/1.7 ui-monospace, monospace; color: var(--text);
           border-top: 1px solid var(--line); margin-top: 12px; padding-top: 8px; }
  #stats span { color: var(--dim); }
  #legend { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap;
            margin-top: 10px; font-size: 11px; color: var(--dim); }
  #legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px;
              margin-right: 5px; vertical-align: -1px; }
  #log div { border-bottom: 1px solid var(--line); padding: 2px 0; }
  #log .t { color: var(--dim); margin-right: 6px; }
  #log .state  { color: var(--accent); }
  #log .solver { color: var(--accent2); }
  #log .player { color: var(--gold); }
  #log .err    { color: var(--warn); }
  #status { font-size: 12px; color: var(--dim); margin-top: 8px; }
  .hint { font-size: 11px; color: var(--dim); margin-top: 10px; }
  kbd { background: var(--bg); border: 1px solid var(--line); border-radius: 3px;
        padding: 0 4px; font-size: 11px; }
</style>
</head>
<body>
<header>
  <h1>DAEDALUS</h1>
  <span>generate &middot; solve &middot; play &mdash; live over STOMP</span>
</header>
<main>
  <section class="panel">
    <h2>Controls</h2>
    <label for="generator">Generator</label>
    <select id="generator"></select>
    <div id="genInfo" class="info"></div>
    <div class="row">
      <div style="flex:1"><label for="rows">Rows</label>
        <input id="rows" type="number" value="21" min="3" max="99"></div>
      <div style="flex:1"><label for="cols">Cols</label>
        <input id="cols" type="number" value="31" min="3" max="99"></div>
    </div>
    <label for="seed">Seed (blank = random)</label>
    <input id="seed" type="number" placeholder="random">
    <button id="generate" class="primary">Generate</button>

    <label for="solver">Solver</label>
    <select id="solver"></select>
    <div id="solInfo" class="info"></div>
    <button id="solve" disabled>Solve</button>

    <label for="player">Player name</label>
    <input id="player" value="web">
    <button id="play" disabled>Open session</button>
    <button id="join" disabled title="Requires daedalus.session.multiplayer=true">
      Join as second player</button>
    <div class="hint">After opening a session: <kbd>&uarr;</kbd><kbd>&darr;</kbd>
      <kbd>&larr;</kbd><kbd>&rarr;</kbd> move the player. With the multiplayer flag on,
      <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> move the joined player.</div>
    <div id="stats"></div>
    <div id="status">no maze yet</div>
  </section>

  <section class="panel" id="board" style="display:block">
    <div style="display:flex;justify-content:center"><canvas id="maze" width="640" height="480"></canvas></div>
    <div id="legend">
      <span><i style="background:#465362"></i>floor</span>
      <span><i style="background:#161c24;border:1px solid #2a323b"></i>wall / rock</span>
      <span><i style="background:#4cc38a;border-radius:50%"></i>start</span>
      <span><i style="background:#e5484d;border-radius:50%"></i>goal</span>
      <span><i style="background:#82b1ff"></i>solver path</span>
      <span><i style="background:#f0b429;border-radius:50%"></i>players</span>
    </div>
  </section>

  <section class="panel">
    <h2>Live frames</h2>
    <div id="log"></div>
  </section>
</main>
<script>
"use strict";
const $ = id => document.getElementById(id);
const API = "/api/v1";
const state = {
  maze: null,            // GenerateResponse (tiles as array of strings, thanks to Jackson char[])
  path: null,            // SolveResponse.path (cell coords)
  pathProgress: 1,       // 0..1 — animated reveal of the solver path
  session: null,         // { id, positions: {playerName: {row,col}}, primary, goal }
  joined: null,          // second player's name, when joined
  trails: {},            // playerName -> [Point] breadcrumbs during play
  algos: {},             // id -> AlgorithmDescriptor, for the info cards
  stomp: null,
  subs: [],
};

function log(kind, text) {
  const line = document.createElement("div");
  const t = new Date().toLocaleTimeString();
  line.innerHTML = `<span class="t">${t}</span><span class="${kind}">${text}</span>`;
  const box = $("log");
  box.prepend(line);
  while (box.childElementCount > 200) box.lastChild.remove();
}

// ---------- REST ----------
async function api(path, opts) {
  const res = await fetch(API + path, opts);
  if (!res.ok) throw new Error(`${res.status} ${res.statusText} on ${path}`);
  const text = await res.text();
  return text ? JSON.parse(text) : null;
}

async function loadAlgorithms() {
  const all = await api("/algorithms");
  for (const [selId, list] of [["generator", all.generators], ["solver", all.solvers]]) {
    const sel = $(selId);
    sel.innerHTML = "";
    list.sort((a, b) => a.id.localeCompare(b.id)).forEach(a => {
      state.algos[a.id] = a;
      const o = document.createElement("option");
      o.value = a.id; o.textContent = a.displayName || a.id;
      sel.appendChild(o);
    });
  }
  $("generator").value = "recursive-backtracker";
  $("solver").value = "bfs";
  updateInfo();
}

/** The catalog ships bias notes and complexity for every algorithm — show them off. */
function updateInfo() {
  for (const [selId, infoId] of [["generator", "genInfo"], ["solver", "solInfo"]]) {
    const a = state.algos[$(selId).value];
    $(infoId).innerHTML = !a ? "" :
        `<b>${a.displayName}</b> &middot; ${a.complexity || ""}<br>${a.biasNote || a.description || ""}`;
  }
}
$("generator").addEventListener("change", updateInfo);
$("solver").addEventListener("change", updateInfo);

async function generate() {
  const body = {
    generatorId: $("generator").value,
    rows: +$("rows").value, cols: +$("cols").value,
    seed: $("seed").value === "" ? null : +$("seed").value,
  };
  const t0 = performance.now();
  const maze = await api("/maze/generate", {
    method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body),
  });
  state.maze = maze; state.path = null; state.session = null;
  state.joined = null; state.trails = {};
  $("solve").disabled = false; $("play").disabled = false; $("join").disabled = true;
  $("status").textContent = "arrow keys move once a session is open";
  $("stats").innerHTML =
      `<span>maze</span> ${maze.id.slice(0, 8)}&hellip;<br>`
      + `<span>by</span> ${maze.generatorId} &middot; ${maze.rows}&times;${maze.cols} `
      + `&middot; <span>seed</span> ${maze.seed}<br>`
      + `<span>round-trip</span> ${(performance.now() - t0).toFixed(0)} ms<br>`;
  resubscribe();
  draw();
}

async function solve() {
  const r = await api(`/maze/${state.maze.id}/solve/${$("solver").value}`, {method: "POST"});
  state.path = r.path;
  log("solver", `${r.solverId}: path ${r.path.length}, visited ${r.visited}, `
      + `${r.elapsedMs}ms, success=${r.success}`);
  $("stats").innerHTML +=
      `<span>${r.solverId}</span> path ${r.path.length} &middot; visited ${r.visited} `
      + `&middot; explored ${r.explored} &middot; ${r.elapsedMs} ms`
      + (r.success ? "" : " &middot; <b>no route</b>") + "<br>";
  animatePath();
}

/** Progressive reveal of the solver path — watching the route unfold beats a pop-in. */
function animatePath() {
  const started = performance.now(), duration = 700;
  const step = now => {
    state.pathProgress = Math.min(1, (now - started) / duration);
    draw();
    if (state.pathProgress < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

async function play() {
  const name = $("player").value || "web";
  const s = await api(`/maze/${state.maze.id}/session?player=${encodeURIComponent(name)}`,
      {method: "POST"});
  state.session = {id: s.sessionId, positions: {[name]: s.position}, primary: name};
  state.joined = null;
  state.trails = {[name]: [s.position]};
  $("join").disabled = false;
  $("status").textContent = `session ${s.sessionId.slice(0, 8)}… — arrow keys to move`;
  resubscribe();
  draw();
}

async function join() {
  const name = ($("player").value || "web") + "-2";
  try {
    const s = await api(`/session/${state.session.id}/join?player=${encodeURIComponent(name)}`,
        {method: "POST"});
    state.joined = name;
    state.session.positions[name] = s.position;
    state.trails[name] = [s.position];
    log("player", `${name} joined (multiplayer flag is on)`);
    draw();
  } catch (e) {
    log("err", `join refused — is daedalus.session.multiplayer=true? (${e.message})`);
  }
}

async function move(name, dr, dc) {
  if (!state.session) return;
  const at = state.session.positions[name];
  if (!at) return;
  const to = {row: at.row + dr, col: at.col + dc};
  const body = name === state.session.primary ? {to} : {to, player: name};
  try {
    await api(`/session/${state.session.id}/move`, {
      method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body),
    });
    // Position updates arrive via the STOMP frame, keeping every viewer consistent.
  } catch (e) { log("err", e.message); }
}

// ---------- STOMP ----------
let stompWarned = false;
function connectStomp() {
  if (typeof Stomp === "undefined" || typeof SockJS === "undefined") {
    // CDN unreachable (offline / blocked network). Everything REST-driven still works;
    // only the live-frames panel degrades. Say so once, quietly, instead of leaking a
    // ReferenceError into the log.
    if (!stompWarned) {
      stompWarned = true;
      log("state", "live frames unavailable (STOMP libraries did not load) — "
          + "generate, solve, and play still work");
    }
    return;
  }
  const client = Stomp.over(new SockJS("/ws"));
  client.debug = null;
  client.connect({}, () => {
    state.stomp = client;
    log("state", "STOMP connected");
    resubscribe();
  }, err => {
    state.stomp = null;
    log("err", "STOMP connection lost — retrying in 3s");
    setTimeout(connectStomp, 3000);
  });
}

function resubscribe() {
  if (!state.stomp) return;
  state.subs.forEach(s => { try { s.unsubscribe(); } catch (ignored) {} });
  state.subs = [];
  if (state.maze) {
    state.subs.push(state.stomp.subscribe(`/topic/maze/${state.maze.id}/state`, f => {
      const m = JSON.parse(f.body);
      log("state", `generated ${m.rows}×${m.cols} by ${m.generatorId}`);
    }));
    state.subs.push(state.stomp.subscribe(`/topic/maze/${state.maze.id}/solver`, f => {
      const m = JSON.parse(f.body);
      log("solver", `${m.solverId} finished: path ${m.pathLength}, success=${m.success}`);
    }));
  }
  if (state.session) {
    state.subs.push(state.stomp.subscribe(`/topic/session/${state.session.id}/player`, f => {
      const m = JSON.parse(f.body);
      const who = m.player || state.session.primary;
      state.session.positions[who] = m.to;
      (state.trails[who] = state.trails[who] || []).push(m.to);
      log("player", `${who}: (${m.from.row},${m.from.col}) → (${m.to.row},${m.to.col})`);
      const t = state.maze.tiles;
      if (t[2 * m.to.row + 1][2 * m.to.col + 1] === "G") {
        log("state", `${who} reached the goal — session complete`);
        $("status").textContent = `${who} reached the goal — session complete`;
      }
      draw();
    }));
  }
  state.subs.push(state.stomp.subscribe("/topic/plugins/failures", f => {
    const m = JSON.parse(f.body);
    log("err", `plugin ${m.pluginId} failed in ${m.phase}: ${m.errorClass}`);
  }));
}

// ---------- rendering ----------
// Corridors render wide and light on thin dark walls (a maze is open space between walls,
// not a grid of blocks), and a cell whose four sides are all closed is ROCK — uncarved
// space, drawn as solid wall. Without that rule the BSP dungeon's rock renders as a
// polka-dot field of floating floor specks, because the tile projection marks every cell
// position as passage whether or not anything ever carved it.
const COLORS = {
  wall: "#161c24", floor: "#465362", start: "#4cc38a", goal: "#e5484d", path: "#82b1ff",
};
const PLAYER_COLORS = ["#f0b429", "#ff8fa3", "#9ecbff", "#7ce2b3"];
let geom = null; // {offX, offY, cell, wall} — track offsets for the current maze

function computeGeometry(tiles) {
  const th = tiles.length, tw = tiles[0].length;
  const cols = (tw - 1) / 2;
  const cell = Math.max(6, Math.min(26, Math.floor(880 / (cols * 1.25 + 0.25))));
  const wall = Math.max(2, Math.round(cell / 4));
  const track = n => {
    const off = new Array(n + 1);
    off[0] = 0;
    for (let i = 0; i < n; i++) off[i + 1] = off[i] + (i % 2 === 0 ? wall : cell);
    return off;
  };
  return { offX: track(tw), offY: track(th), cell, wall };
}

function isRock(tiles, r, c) {
  return tiles[r - 1][c] === "#" && tiles[r + 1][c] === "#"
      && tiles[r][c - 1] === "#" && tiles[r][c + 1] === "#"
      && tiles[r][c] !== "S" && tiles[r][c] !== "G";
}

// A wall corner post (even,even tile) whose four surrounding wall segments are all open is
// interior to an open area — a dungeon room — and renders as floor. In a perfect maze this
// never fires (a 2x2 of mutually open cells is a cycle); in rooms it removes the grid of
// specks the posts would otherwise leave.
function isInteriorPost(tiles, r, c) {
  return r > 0 && c > 0 && r < tiles.length - 1 && c < tiles[0].length - 1
      && tiles[r - 1][c] !== "#" && tiles[r + 1][c] !== "#"
      && tiles[r][c - 1] !== "#" && tiles[r][c + 1] !== "#";
}

function cellCenter(p) {
  return [geom.offX[2 * p.col + 1] + geom.cell / 2,
          geom.offY[2 * p.row + 1] + geom.cell / 2];
}

function marker(g, p, color, radius) {
  const [x, y] = cellCenter(p);
  g.fillStyle = color;
  g.beginPath();
  g.arc(x, y, geom.cell * radius, 0, 2 * Math.PI);
  g.fill();
}

function draw() {
  if (!state.maze) return;
  const tiles = state.maze.tiles; // array of strings (Jackson renders char[] rows as strings)
  const th = tiles.length, tw = tiles[0].length;
  geom = computeGeometry(tiles);
  const c = $("maze");
  c.width = geom.offX[tw]; c.height = geom.offY[th];
  const g = c.getContext("2d");

  g.fillStyle = COLORS.wall;
  g.fillRect(0, 0, c.width, c.height);
  let start = null, goal = null;
  for (let r = 0; r < th; r++) {
    for (let col = 0; col < tw; col++) {
      const t = tiles[r][col];
      if (t === "#" && !(r % 2 === 0 && col % 2 === 0 && isInteriorPost(tiles, r, col))) {
        continue;                                                  // wall stays wall
      }
      if (r % 2 === 1 && col % 2 === 1 && isRock(tiles, r, col)) continue; // rock stays wall
      g.fillStyle = COLORS.floor;
      g.fillRect(geom.offX[col], geom.offY[r],
                 geom.offX[col + 1] - geom.offX[col], geom.offY[r + 1] - geom.offY[r]);
      if (t === "S") start = { row: (r - 1) / 2, col: (col - 1) / 2 };
      if (t === "G") goal  = { row: (r - 1) / 2, col: (col - 1) / 2 };
    }
  }

  if (state.path && state.path.length > 1) {
    const visible = Math.max(2, Math.ceil(state.path.length * state.pathProgress));
    g.strokeStyle = COLORS.path;
    g.lineWidth = Math.max(2, geom.cell * 0.4);
    g.lineCap = "round"; g.lineJoin = "round";
    g.globalAlpha = 0.9;
    g.beginPath();
    state.path.slice(0, visible).forEach((p, i) => {
      const [x, y] = cellCenter(p);
      i === 0 ? g.moveTo(x, y) : g.lineTo(x, y);
    });
    g.stroke();
    g.globalAlpha = 1;
  }
  // Breadcrumb trails: where each player has actually walked.
  Object.entries(state.trails).forEach(([name, points], i) => {
    g.fillStyle = PLAYER_COLORS[i % PLAYER_COLORS.length];
    g.globalAlpha = 0.28;
    points.forEach(p => {
      const [x, y] = cellCenter(p);
      g.beginPath();
      g.arc(x, y, geom.cell * 0.16, 0, 2 * Math.PI);
      g.fill();
    });
    g.globalAlpha = 1;
  });
  if (start) marker(g, start, COLORS.start, 0.34);
  if (goal)  marker(g, goal,  COLORS.goal,  0.34);
  if (state.session) {
    Object.entries(state.session.positions).forEach(([name, p], i) => {
      marker(g, p, PLAYER_COLORS[i % PLAYER_COLORS.length], 0.42);
    });
  }
}

/** Empty-state canvas: an invitation, not a void. */
function drawEmpty() {
  const c = $("maze"), g = c.getContext("2d");
  g.fillStyle = COLORS.wall;
  g.fillRect(0, 0, c.width, c.height);
  g.fillStyle = "#8a949e";
  g.font = "14px system-ui, sans-serif";
  g.textAlign = "center";
  g.fillText("Pick a generator and press Generate", c.width / 2, c.height / 2 - 8);
  g.fillStyle = "#5c6771";
  g.fillText("then Solve to watch a route unfold, or open a session and play",
      c.width / 2, c.height / 2 + 16);
}

// ---------- wiring ----------
$("generate").onclick = () => generate().catch(e => log("err", e.message));
$("solve").onclick = () => solve().catch(e => log("err", e.message));
$("play").onclick = () => play().catch(e => log("err", e.message));
$("join").onclick = () => join();
document.addEventListener("keydown", e => {
  if (!state.session || e.target.tagName === "INPUT") return;
  const arrows = {ArrowUp: [-1, 0], ArrowDown: [1, 0], ArrowLeft: [0, -1], ArrowRight: [0, 1]};
  const wasd = {KeyW: [-1, 0], KeyS: [1, 0], KeyA: [0, -1], KeyD: [0, 1]};
  if (arrows[e.key]) {
    e.preventDefault();
    move(state.session.primary, ...arrows[e.key]);
  } else if (state.joined && wasd[e.code]) {
    e.preventDefault();
    move(state.joined, ...wasd[e.code]);
  }
});

drawEmpty();
loadAlgorithms().then(connectStomp).catch(e => log("err", e.message));
</script>
</body>
</html>
