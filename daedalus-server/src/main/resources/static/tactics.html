<!DOCTYPE html>
<!-- SPDX-License-Identifier: MIT
     The squad director, watchable (ADR-060): the same Decide() the Unreal plugin runs (tactics-core.js, parity-tested
     against C++ and Java), driving three foes against you on a top-down field. Drag the player or use WASD/arrows.
     Vanilla JS, no build step. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Squad Tactics</title>
<style>
  :root { --bg: #0f1218; --panel: #171c26; --line: #2a3242; --text: #e9edf5; --dim: #9aa6bd; --gold: #f2c35b;
    --atk: #ff6b5e; --flank: #5ec8ff; --def: #8fd97a; --ret: #c79bff; --hold: #9aa6bd; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 12px; padding: 12px; min-height: 100vh; }
  @media (max-width: 820px) { main { grid-template-columns: 1fr; } }
  canvas { width: 100%; aspect-ratio: 1 / 1; max-height: calc(100vh - 24px); background: #121722; border: 1px solid var(--line);
    border-radius: 12px; touch-action: none; display: block; }
  aside { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
  h1 { margin: 0 0 4px; font-size: 16px; letter-spacing: .06em; color: var(--gold); }
  .dim { color: var(--dim); font-size: 12px; }
  label { display: flex; align-items: center; gap: 8px; font-size: 13px; margin: 6px 0; }
  input[type=range] { flex: 1; accent-color: var(--gold); }
  button { font: inherit; font-size: 13px; color: var(--text); background: #222a38; border: 1px solid var(--line);
    border-radius: 8px; padding: 6px 10px; cursor: pointer; }
  button:hover, button:focus-visible { border-color: var(--gold); outline: none; }
  pre { margin: 0; white-space: pre-wrap; word-break: break-word; font: 12px/1.4 ui-monospace, Consolas, monospace; color: #cfd8ea; max-height: 220px; overflow: auto; }
  ul { margin: 0; padding-left: 0; list-style: none; }
  li { margin: 4px 0; font-size: 13px; }
  .tag { display: inline-block; min-width: 104px; margin-right: 6px; font-weight: 600; }
</style>
</head>
<body>
<main>
  <canvas id="field" aria-label="Top-down field: you and the squad"></canvas>
  <aside>
    <div class="card">
      <h1>SQUAD TACTICS</h1>
      <div class="dim">The same director Unreal runs, deciding once a second: one attacks, two flank, the badly hurt
        retreat. Drag yourself, or move with WASD or the arrow keys.</div>
    </div>
    <div class="card">
      <label>Your height <input id="height" type="range" min="-200" max="800" step="10" value="0"> <span id="hv">0 cm</span></label>
      <div id="sliders"></div>
      <div style="display:flex; gap:8px; flex-wrap:wrap; margin-top:6px">
        <button id="reset" type="button">Reset squad</button>
        <button id="pause" type="button" aria-pressed="false">Pause</button>
      </div>
    </div>
    <div class="card"><ul id="orders" aria-live="polite"></ul></div>
    <div class="card"><div class="dim" style="margin-bottom:6px">DTO 1, exactly what Unreal would receive</div><pre id="spec"></pre></div>
  </aside>
</main>
<script type="module" src="/tactics.js"></script>
</body>
</html>
