# SPDX-License-Identifier: MIT
name: World census offline
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'tools/world_census/**'
      - 'schemas/world-census-v1.schema.json'
      - 'schemas/world-census-bindings-v1.schema.json'
      - '.github/workflows/world-census.yml'
  push:
    branches: [main]
    paths:
      - 'tools/world_census/**'
      - 'schemas/world-census-v1.schema.json'
      - 'schemas/world-census-bindings-v1.schema.json'
      - '.github/workflows/world-census.yml'
permissions:
  contents: read
jobs:
  offline-census:
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - name: Install schema test dependency
        run: python -m pip install --disable-pip-version-check jsonschema==4.26.0
      - name: Run offline contracts and CLI tests
        run: python -B -m unittest tools.world_census.test_census -v
