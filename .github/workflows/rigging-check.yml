# SPDX-License-Identifier: MIT
name: rigging-check
on:
  push:
    branches: [main]
    paths:
      - 'tools/streaming/rigging_check*.py'
      - 'data/islands/disk-saver/rigging-check-v1.json'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'tools/streaming/rigging_check*.py'
      - 'data/islands/disk-saver/rigging-check-v1.json'
      - '.github/workflows/**'
permissions:
  contents: read
jobs:
  rigging-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - run: python -B -m unittest tools/streaming/rigging_check_test.py -v
      - run: python -B tools/streaming/rigging_check.py --under tools/streaming --fail-on frayed
      - run: python -B tools/streaming/rigging_check.py