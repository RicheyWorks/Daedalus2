name: Battle stage core
on:
  pull_request:
    paths:
      - 'engines/unreal/**/DaedalusBattleStageCore.h'
      - 'engines/unreal/core-test/battle_stage_core_test.cpp'
      - '.github/workflows/battle-stage-core.yml'
  push:
    branches: [main]
    paths:
      - 'engines/unreal/**/DaedalusBattleStageCore.h'
      - 'engines/unreal/core-test/battle_stage_core_test.cpp'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  director:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        compiler: [g++, clang++]
    steps:
      - uses: actions/checkout@v7
      - name: Battle stage director rules (sanitized)
        run: |
          ${{ matrix.compiler }} -std=c++17 -O1 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer engines/unreal/core-test/battle_stage_core_test.cpp -o "$RUNNER_TEMP/battle_stage"
          "$RUNNER_TEMP/battle_stage"
