# SPDX-License-Identifier: MIT
name: Journal Tide
on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/streaming/journal_tide.py'
      - 'tools/streaming/journal_tide_test.py'
      - 'data/islands/disk-saver/journal-tide-v1.json'
      - 'data/islands/disk-saver/coral-wear-v1.json'
      - '.github/workflows/journal-tide.yml'
permissions:
  contents: read
jobs:
  journal-tide:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - name: G79 Journal Tide rules (CRC records, torn-tail recovery, paced commits vs traps, G78 tie-in)
        run: python -m unittest tools/streaming/journal_tide_test.py -v
      - name: CLI smoke (paced keeper wins)
        run: python tools/streaming/journal_tide.py data/islands/disk-saver/journal-tide-v1.json
