name: marsh-cores

# Header-only C++17 ports of marsh-lane ecology cores (G570 Drought Odds, ...): every marsh_*_core_test.cpp
# replays its Java-written golden vectors. Standalone compilers only, no Unreal, no UBT.
on:
  pull_request:
    paths:
      - "engines/unreal/DaedalusLink/Source/DaedalusLink/Public/DaedalusMarsh*Core.h"
      - "engines/unreal/core-test/marsh_*"
      - ".github/workflows/marsh-cores.yml"
  push:
    branches: [main]
    paths:
      - "engines/unreal/DaedalusLink/Source/DaedalusLink/Public/DaedalusMarsh*Core.h"
      - "engines/unreal/core-test/marsh_*"
      - ".github/workflows/marsh-cores.yml"

permissions:
  contents: read

jobs:
  native:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cxx: [g++, clang++]
    steps:
      - uses: actions/checkout@v4
      - name: Build and replay golden vectors (${{ matrix.cxx }}, ASan+UBSan)
        working-directory: engines/unreal/core-test
        run: |
          set -euo pipefail
          shopt -s nullglob
          tests=(marsh_*_core_test.cpp)
          [ ${#tests[@]} -gt 0 ] || { echo "no marsh core tests found"; exit 1; }
          for t in "${tests[@]}"; do
            name="${t%_core_test.cpp}"
            ${{ matrix.cxx }} -std=c++17 -O1 -g -Wall -Wextra -Wshadow -Werror \
              -fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer \
              -I../DaedalusLink/Source/DaedalusLink/Public "$t" -o "/tmp/$name"
            "/tmp/$name" "${name}_parity.txt"
          done
