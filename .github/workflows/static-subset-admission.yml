name: Static subset admission
on:
  pull_request:
    paths:
      - 'connectors/claude-asset-pipeline/asset_pipeline/subset.py'
      - 'connectors/claude-asset-pipeline/harness/subset_test.py'
      - 'connectors/claude-asset-pipeline/docs/static-subset-admission.md'
      - '.github/workflows/static-subset-admission.yml'
permissions:
  contents: read
jobs:
  offline:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    defaults:
      run:
        working-directory: connectors/claude-asset-pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python harness/subset_test.py
