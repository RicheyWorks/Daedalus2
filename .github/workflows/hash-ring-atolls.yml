# SPDX-License-Identifier: MIT
name: Hash Ring Atolls
on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/streaming/hash_ring_atolls.py'
      - 'tools/streaming/hash_ring_atolls_test.py'
      - 'data/islands/disk-saver/hash-ring-atolls-v1.json'
      - 'data/islands/disk-saver/compaction-shoals-v1.json'
      - '.github/workflows/hash-ring-atolls.yml'
permissions:
  contents: read
jobs:
  hash-ring-atolls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - name: G105 Hash Ring Atolls rules (consistent hashing, marker and mod-N traps, G86 tie-in)
        run: python -m unittest tools/streaming/hash_ring_atolls_test.py -v
      - name: CLI smoke (virtual markers win)
        run: python tools/streaming/hash_ring_atolls.py data/islands/disk-saver/hash-ring-atolls-v1.json
