# SPDX-License-Identifier: MIT
name: Native capture transport
on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/unreal_mcp/**'
      - '.github/workflows/native-capture-transport.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  transport:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - name: Offline transport and image regressions
        run: python -m unittest tools.unreal_mcp.test_transport tools.unreal_mcp.test_capture_proxy -v
