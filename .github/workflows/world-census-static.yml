# SPDX-License-Identifier: MIT
name: World census static analysis
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'tools/world_census/**'
      - 'tools/python_quality/requirements-lint.txt'
      - '.github/workflows/world-census-static.yml'
  push:
    branches: [main]
    paths:
      - 'tools/world_census/**'
      - 'tools/python_quality/requirements-lint.txt'
      - '.github/workflows/world-census-static.yml'
permissions:
  contents: read
jobs:
  census-ruff:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: tools/python_quality/requirements-lint.txt
      - name: Install pinned census linter
        run: >-
          python -m pip install --disable-pip-version-check --only-binary=:all:
          --requirement tools/python_quality/requirements-lint.txt
      - name: Show census Python scope
        run: python -m ruff check --config tools/world_census/ruff.toml --show-files tools/world_census
      - name: Check census errors and Pyflakes rules
        run: python -m ruff check --config tools/world_census/ruff.toml --output-format github tools/world_census
