# SPDX-License-Identifier: MIT
name: Prismheart shop checks
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'tools/rpg_demo/index.html'
      - 'tools/rpg_demo/shop_view_test.js'
      - 'tools/rpg_demo/shop_gear_info_test.js'
      - 'tools/rpg_demo/shop_spell_info_test.js'
      - 'tools/rpg_demo/shop_purchase_test.js'
      - 'tools/rpg_demo/shop_cancel_test.js'
      - 'data/rpg/party.json'
      - 'data/rpg/interiors.json'
      - 'data/rpg/spells.json'
      - 'data/rpg/prism-fish.json'
      - 'data/rpg/menus.json'
      - 'data/rpg/town-tiles.json'
      - '.github/workflows/prism-shop.yml'
permissions:
  contents: read
jobs:
  source-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      # These existing VM/canvas-command checks need no browser, assets or native runtime.
      # Keep them serial, with the same heap cap used for local validation.
      - name: Shop view and final-copy sale navigation
        run: node --max-old-space-size=128 tools/rpg_demo/shop_view_test.js
      - name: Gear facts and auto-fit preview
        run: node --max-old-space-size=128 tools/rpg_demo/shop_gear_info_test.js
      - name: Spell facts and learning preview
        run: node --max-old-space-size=128 tools/rpg_demo/shop_spell_info_test.js
      - name: Prismheart and Portal purchase rules
        run: node --max-old-space-size=128 tools/rpg_demo/shop_purchase_test.js
      - name: Shop cancellation and input priority
        run: node --max-old-space-size=128 tools/rpg_demo/shop_cancel_test.js
