# SPDX-License-Identifier: MIT
name: Harbour Seals
on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/streaming/harbour_seals.py'
      - 'tools/streaming/harbour_seals_test.py'
      - 'tools/streaming/census_budget.py'
      - 'tools/world_census/**'
      - 'data/islands/disk-saver/harbour-seals-v1.json'
      - 'data/islands/disk-saver/beacon-watch-baseline-v1.json'
      - 'data/islands/disk-saver/census-budget-v1.json'
      - '.github/workflows/harbour-seals.yml'
permissions:
  contents: read
jobs:
  harbour-seals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - name: G525 Harbour Seals (each verdict, field diffs, random edits caught, real census, CLI)
        run: python -B -m unittest tools/streaming/harbour_seals_test.py -v
      - name: Seal the committed G505 baseline against the real world census (--fail-on-broken)
        run: |
          python -B -m tools.world_census tools/world_census/fixtures/alpha.json tools/world_census/fixtures/beta.json --snapshot-date 2026-10-26 --bindings tools/world_census/fixtures/bindings.json --output-dir "$RUNNER_TEMP/census"
          python tools/streaming/harbour_seals.py "$RUNNER_TEMP/census/census.json" data/islands/disk-saver/beacon-watch-baseline-v1.json --fail-on-broken