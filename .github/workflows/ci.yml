# SPDX-License-Identifier: MIT
#
# Continuous integration for Daedalus.
#
# Runs the full Maven reactor (`mvn -B install`) on every push / PR against
# main, then builds every example module so the worked examples don't
# silently rot.
#
# The examples build AFTER the reactor on purpose — their poms resolve
# daedalus-plugin-api (and friends) from the local Maven repo (~/.m2), which
# only the `install` phase populates. (`verify` runs all tests but installs
# nothing, which is why the reactor step must run `install`, not `verify`.)

name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Cancel in-flight runs on the same ref when a new push lands — saves CI
# minutes on rapid pushes / rebases.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# contents: write is needed only by the coverage-badge commit step on main.
permissions:
  contents: write

jobs:
  build:
    name: Build & test
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Java 21 (Temurin)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          # setup-java's built-in cache covers ~/.m2/repository keyed on the
          # pom set — equivalent to a manual actions/cache step but maintained
          # upstream.
          cache: maven

      # Force English locale + UTC so any test that asserts on formatted text
      # or timestamps behaves identically on every runner. Cheap insurance.
      - name: Set deterministic locale
        run: |
          echo "LANG=en_US.UTF-8"  >> "$GITHUB_ENV"
          echo "LC_ALL=en_US.UTF-8" >> "$GITHUB_ENV"
          echo "TZ=UTC"             >> "$GITHUB_ENV"

      - name: Build & test the reactor
        run: mvn -B -ntp clean install

      - name: Build the reference biome-plugin
        # Runs after the reactor so daedalus-plugin-api is in ~/.m2. Tests in
        # the example pom run via the default surefire binding.
        run: mvn -B -ntp -f examples/biome-plugin/pom.xml clean package

      - name: Build the remaining examples
        # Same ordering constraint as biome-plugin: these poms resolve the
        # reactor's artifacts from ~/.m2, so they must run after `install`.
        # Their tests pin the claims the examples' narratives make — without
        # this step, 17 test methods across these three modules never execute
        # on any push, and a core API change that breaks an example ships
        # green (TESTING.md, gap P1).
        run: |
          mvn -B -ntp -f examples/loadbalancer-topology/pom.xml clean package
          mvn -B -ntp -f examples/dungeon-layout/pom.xml clean package
          mvn -B -ntp -f examples/benchmark-harness/pom.xml clean package

      # Coverage badge: only on pushes to main (not PRs — no commit rights
      # there, and the badge should reflect main anyway).
      - name: Collect JaCoCo reports
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: jacoco
        run: |
          FILES="$(find . -path '*/target/site/jacoco/jacoco.csv' | tr '\n' ' ')"
          echo "files=$FILES" >> "$GITHUB_OUTPUT"
          echo "Found reports: $FILES"

      - name: Generate coverage badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.jacoco.outputs.files != ''
        uses: cicirello/jacoco-badge-generator@v2
        with:
          jacoco-csv-file: ${{ steps.jacoco.outputs.files }}
          badges-directory: .github/badges

      - name: Commit updated coverage badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if [[ -n "$(git status --porcelain .github/badges)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .github/badges
            git commit -m "chore: update coverage badge [skip ci]"
            git push
          else
            echo "Badge unchanged — nothing to commit."
          fi

      - name: Upload server JAR (for inspection on failure)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: daedalus-server-jar
          path: daedalus-server/target/*.jar
          if-no-files-found: ignore
          retention-days: 7
