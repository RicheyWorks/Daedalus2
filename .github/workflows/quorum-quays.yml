# SPDX-License-Identifier: MIT
name: Quorum Quays
on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/streaming/quorum_quays.py'
      - 'tools/streaming/quorum_quays_test.py'
      - 'data/islands/disk-saver/quorum-quays-v1.json'
      - 'data/islands/disk-saver/compaction-shoals-v1.json'
      - '.github/workflows/quorum-quays.yml'
permissions:
  contents: read
jobs:
  quorum-quays:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - name: G110 Quorum Quays rules (no stale reads, availability, quorum traps, G86 tie-in)
        run: python -m unittest tools/streaming/quorum_quays_test.py -v
      - name: CLI smoke (majority quorum wins)
        run: python tools/streaming/quorum_quays.py data/islands/disk-saver/quorum-quays-v1.json
