name: Container runtime resources
on:
  pull_request:
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'tools/deploy/**'
      - 'tools/inventory/packaged_server_smoke.py'
      - 'engines/unreal/DaedalusLink/Content/Inventory/**'
      - 'tools/islands/kennel-isle/tonics.json'
      - 'daedalus-core/pom.xml'
      - 'daedalus-server/pom.xml'
      - 'daedalus-server/src/main/java/com/daedalus/server/config/RedisConfig.java'
      - 'daedalus-server/src/test/java/com/daedalus/server/config/RedisConfigConditionalTest.java'
      - '.github/workflows/container-resources.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: container-resources-${{ github.ref }}
  cancel-in-progress: true
jobs:
  redis-binding:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Full server reactor verification with configured Redis factory
        run: mvn -B -ntp -pl daedalus-server -am verify
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Resource verifier rejects missing or changed data
        run: python3 tools/deploy/test_container_resources.py
      - name: Build the real container image
        run: docker build --tag daedalus-resource-smoke:${{ github.sha }} .
      - name: Boot production image and verify packaged resources and authenticated HTTP
        run: python3 tools/deploy/container_smoke.py --image daedalus-resource-smoke:${{ github.sha }} --output "${{ runner.temp }}/container-proof"
      - name: Restore saved worlds and edits from an actual backup into a different volume
        run: python3 tools/deploy/container_recovery.py --image daedalus-resource-smoke:${{ github.sha }} --output "${{ runner.temp }}/recovery-proof"
      - name: Verify authenticated Redis and restore its persisted application data
        run: python3 tools/deploy/redis_recovery.py --image daedalus-resource-smoke:${{ github.sha }} --output "${{ runner.temp }}/redis-proof"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: container-resource-proof
          path: ${{ runner.temp }}/container-proof
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: container-recovery-proof
          path: ${{ runner.temp }}/recovery-proof
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: redis-recovery-proof
          path: ${{ runner.temp }}/redis-proof
          if-no-files-found: ignore
