# SPDX-License-Identifier: MIT
name: Garbage Gulls
on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/streaming/garbage_gulls.py'
      - 'tools/streaming/garbage_gulls_test.py'
      - 'data/islands/disk-saver/garbage-gulls-v1.json'
      - 'data/islands/disk-saver/compaction-shoals-v1.json'
      - '.github/workflows/garbage-gulls.yml'
permissions:
  contents: read
jobs:
  garbage-gulls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - name: G120 Garbage Gulls rules (mark-and-sweep safety, interval and refcount traps, G86 tie-in)
        run: python -m unittest tools/streaming/garbage_gulls_test.py -v
      - name: CLI smoke (tuned sweep interval wins)
        run: python tools/streaming/garbage_gulls.py data/islands/disk-saver/garbage-gulls-v1.json
