# SPDX-License-Identifier: MIT
name: Art queue recovery

on:
  pull_request:
    paths:
      - "connectors/claude-asset-pipeline/asset_pipeline/**"
      - "connectors/claude-asset-pipeline/harness/**"
      - ".github/workflows/art-queue.yml"
  push:
    branches: [main]
    paths:
      - "connectors/claude-asset-pipeline/asset_pipeline/**"
      - "connectors/claude-asset-pipeline/harness/**"
      - ".github/workflows/art-queue.yml"

permissions:
  contents: read

jobs:
  offline-recovery:
    name: Offline publication and restart (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: connectors/claude-asset-pipeline
    steps:
      - uses: actions/checkout@v4
      - name: Existing queue contracts
        run: python -B -m harness.artqueue_test
      - name: Publication faults, restart, uncertainty and competing producers
        run: python -B -m unittest -v harness.artqueue_publication_test
