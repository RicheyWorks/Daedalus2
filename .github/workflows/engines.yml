# SPDX-License-Identifier: MIT
#
# Engines (ADR-032): the Unreal plugin's engine-free mesher must agree with the Java mesher bit for bit
# (the committed fixture, written by MeshFixtureTest), the import script must check packages, and the
# PowerShell setup must run its plan on Windows. No Unreal Engine here: that is checked on a real install.

name: Engines

on:
  push:
    branches: [ main ]
    paths: [ "engines/**", "tools/unreal/*runtime_data.py", "tools/realm/**", "daedalus-core/src/main/java/com/daedalus/world/export/**", ".github/workflows/engines.yml" ]
  pull_request:
    # Match the approved cabinet dependency stack as well as main. "edited" covers a stacked PR whose base is
    # retargeted to main after its parent merges; without it that PR never gets these checks.
    types: [ opened, synchronize, reopened, edited ]
    branches: [ main, codex/realm-production-queue ]
    paths: [ "engines/**", "tools/unreal/*runtime_data.py", "tools/realm/**", "daedalus-core/src/main/java/com/daedalus/world/export/**", ".github/workflows/engines.yml" ]

concurrency:
  group: engines-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  mesh-parity:
    name: C++ mesher parity (gcc, clang)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: engines/unreal/core-test
    steps:
      - uses: actions/checkout@v4
      - name: Every minigame C++ core has a parity fixture and a CI core test
        working-directory: ${{ github.workspace }}
        run: python3 tools/minigames/minigame_core_parity.py --check
      - name: gcc
        run: g++ -std=c++17 -O2 -Wall -Wextra -Werror -I../DaedalusLink/Source/DaedalusLink/Public mesh_core_test.cpp -o mesh_core_test && ./mesh_core_test isle8.mesh.txt
      - name: clang
        run: clang++ -std=c++17 -O2 -Wall -Wextra -Wshadow -Werror -I../DaedalusLink/Source/DaedalusLink/Public mesh_core_test.cpp -o mesh_core_test && ./mesh_core_test isle8.mesh.txt
      - name: battlefield ecology DBE 1 reader (ADR-061)
        run: g++ -std=c++17 -O1 -Wall -Wextra -Werror -fsanitize=address,undefined -I../DaedalusLink/Source/DaedalusLink/Public ecology_core_test.cpp -o ecology_core_test && ./ecology_core_test
      - name: Kennel Isle TONIC 1 trough core (request, reply parser, trough, effect ledger; fixtures from docs/contracts/tonic-v1)
        run: g++ -std=c++17 -O1 -Wall -Wextra -Werror -fsanitize=address,undefined -I../DaedalusLink/Source/DaedalusLink/Public tonic_core_test.cpp -o tonic_core_test && ./tonic_core_test ../../../docs/contracts/tonic-v1
      - name: Kennel Isle care core (G84 DaedalusKennelCore.h replays the Java bond/training/growth parity table)
        run: g++ -std=c++17 -O1 -Wall -Wextra -Werror -fsanitize=address,undefined -I../DaedalusLink/Source/DaedalusLink/Public kennel_core_test.cpp -o kennel_core_test && ./kennel_core_test kennel_parity.txt
      - name: Kennel Isle pet core for the UE binding (G102 DaedalusKennelPetCore.h; EndDay == G84 rules, seeded drills, tags)
        run: g++ -std=c++17 -O1 -Wall -Wextra -Wshadow -Werror -fsanitize=address,undefined -I../DaedalusLink/Source/DaedalusLink/Public kennel_pet_core_test.cpp -o kennel_pet_core_test && ./kennel_pet_core_test
      - name: Kennel Isle pet core, clang (G102)
        run: clang++ -std=c++17 -O2 -Wall -Wextra -Wshadow -Werror -I../DaedalusLink/Source/DaedalusLink/Public kennel_pet_core_test.cpp -o kennel_pet_core_test_clang && ./kennel_pet_core_test_clang
      - name: Kennel Isle muster core (G128 DaedalusKennelMusterCore.h replays the Java G107 roster parity table)
        run: g++ -std=c++17 -O1 -Wall -Wextra -Wshadow -Werror -fsanitize=address,undefined -I../DaedalusLink/Source/DaedalusLink/Public kennel_muster_core_test.cpp -o kennel_muster_core_test && ./kennel_muster_core_test kennel_muster_parity.txt
      - name: Kennel Isle muster core, clang (G128)
        run: clang++ -std=c++17 -O2 -Wall -Wextra -Wshadow -Werror -I../DaedalusLink/Source/DaedalusLink/Public kennel_muster_core_test.cpp -o kennel_muster_core_test_clang && ./kennel_muster_core_test_clang kennel_muster_parity.txt
      - name: Kennel Isle voyage + landfall core (G154 DaedalusKennelVoyageCore.h replays the Java G140/G147 parity table)
        run: g++ -std=c++17 -O1 -Wall -Wextra -Wshadow -Werror -fsanitize=address,undefined -I../DaedalusLink/Source/DaedalusLink/Public kennel_voyage_core_test.cpp -o kennel_voyage_core_test && ./kennel_voyage_core_test kennel_voyage_parity.txt
      - name: Kennel Isle voyage + landfall core, clang (G154)
        run: clang++ -std=c++17 -O2 -Wall -Wextra -Wshadow -Werror -I../DaedalusLink/Source/DaedalusLink/Public kennel_voyage_core_test.cpp -o kennel_voyage_core_test_clang && ./kennel_voyage_core_test_clang kennel_voyage_parity.txt
      - name: Shardring Resonance core (DaedalusShardringCore.h replays shardring_parity.txt generated from tools/minigames/prism_shard.py; Oracle-fed, no PRNG port)
        run: g++ -std=c++17 -O1 -Wall -Wextra -Wshadow -Werror -fsanitize=address,undefined -I../DaedalusLink/Source/DaedalusLink/Public shardring_core_test.cpp -o shardring_core_test && ./shardring_core_test shardring_parity.txt
      - name: Shardring Resonance core, clang
        run: clang++ -std=c++17 -O2 -Wall -Wextra -Wshadow -Werror -I../DaedalusLink/Source/DaedalusLink/Public shardring_core_test.cpp -o shardring_core_test_clang && ./shardring_core_test_clang shardring_parity.txt
      - name: Lumenpath Refraction core (DaedalusLumenpathCore.h regenerates lumenpath_parity.txt from seed with CPython-compatible seeding)
        run: g++ -std=c++17 -O1 -Wall -Wextra -Wshadow -Werror -fsanitize=address,undefined -I../DaedalusLink/Source/DaedalusLink/Public lumenpath_core_test.cpp -o lumenpath_core_test && ./lumenpath_core_test lumenpath_parity.txt
      - name: Lumenpath Refraction core, clang
        run: clang++ -std=c++17 -O2 -Wall -Wextra -Wshadow -Werror -I../DaedalusLink/Source/DaedalusLink/Public lumenpath_core_test.cpp -o lumenpath_core_test_clang && ./lumenpath_core_test_clang lumenpath_parity.txt
      - name: Shadewatch Vigil core (DaedalusShadewatchCore.h regenerates shadewatch_parity.txt from seed with CPython-compatible seeding)
        run: g++ -std=c++17 -O1 -Wall -Wextra -Wshadow -Werror -fsanitize=address,undefined -I../DaedalusLink/Source/DaedalusLink/Public shadewatch_core_test.cpp -o shadewatch_core_test && ./shadewatch_core_test shadewatch_parity.txt
      - name: Shadewatch Vigil core, clang
        run: clang++ -std=c++17 -O2 -Wall -Wextra -Wshadow -Werror -I../DaedalusLink/Source/DaedalusLink/Public shadewatch_core_test.cpp -o shadewatch_core_test_clang && ./shadewatch_core_test_clang shadewatch_parity.txt
      - name: Glimmerloom Ledger core (DaedalusGlimmerloomCore.h regenerates glimmerloom_parity.txt from seed with CPython-compatible seeding)
        run: g++ -std=c++17 -O1 -Wall -Wextra -Wshadow -Werror -fsanitize=address,undefined -I../DaedalusLink/Source/DaedalusLink/Public glimmerloom_core_test.cpp -o glimmerloom_core_test && ./glimmerloom_core_test glimmerloom_parity.txt
      - name: Glimmerloom Ledger core, clang
        run: clang++ -std=c++17 -O2 -Wall -Wextra -Wshadow -Werror -I../DaedalusLink/Source/DaedalusLink/Public glimmerloom_core_test.cpp -o glimmerloom_core_test_clang && ./glimmerloom_core_test_clang glimmerloom_parity.txt
      - name: Spiritkite Weave core (DaedalusSpiritkiteCore.h regenerates spiritkite_parity.txt from seed with CPython-compatible seeding)
        run: g++ -std=c++17 -O1 -Wall -Wextra -Wshadow -Werror -fsanitize=address,undefined -I../DaedalusLink/Source/DaedalusLink/Public spiritkite_core_test.cpp -o spiritkite_core_test && ./spiritkite_core_test spiritkite_parity.txt
      - name: Spiritkite Weave core, clang
        run: clang++ -std=c++17 -O2 -Wall -Wextra -Wshadow -Werror -I../DaedalusLink/Source/DaedalusLink/Public spiritkite_core_test.cpp -o spiritkite_core_test_clang && ./spiritkite_core_test_clang spiritkite_parity.txt
      - name: Glowmoss Delve core (DaedalusGlowmossCore.h regenerates glowmoss_parity.txt from seed with CPython-compatible seeding)
        run: g++ -std=c++17 -O1 -Wall -Wextra -Wshadow -Werror -fsanitize=address,undefined -I../DaedalusLink/Source/DaedalusLink/Public glowmoss_core_test.cpp -o glowmoss_core_test && ./glowmoss_core_test glowmoss_parity.txt
      - name: Glowmoss Delve core, clang
        run: clang++ -std=c++17 -O2 -Wall -Wextra -Wshadow -Werror -I../DaedalusLink/Source/DaedalusLink/Public glowmoss_core_test.cpp -o glowmoss_core_test_clang && ./glowmoss_core_test_clang glowmoss_parity.txt
      - name: Wardens' Accord core (DaedalusWardensAccordCore.h regenerates wardens_accord_parity.txt from seed with CPython-compatible seeding)
        run: g++ -std=c++17 -O1 -Wall -Wextra -Wshadow -Werror -fsanitize=address,undefined -I../DaedalusLink/Source/DaedalusLink/Public wardens_accord_core_test.cpp -o wardens_accord_core_test && ./wardens_accord_core_test wardens_accord_parity.txt
      - name: Wardens' Accord core, clang
        run: clang++ -std=c++17 -O2 -Wall -Wextra -Wshadow -Werror -I../DaedalusLink/Source/DaedalusLink/Public wardens_accord_core_test.cpp -o wardens_accord_core_test_clang && ./wardens_accord_core_test_clang wardens_accord_parity.txt
      - name: Facetlock Lattice core (DaedalusFacetlockCore.h regenerates facetlock_parity.txt from seed with CPython-compatible seeding)
        run: g++ -std=c++17 -O1 -Wall -Wextra -Wshadow -Werror -fsanitize=address,undefined -I../DaedalusLink/Source/DaedalusLink/Public facetlock_core_test.cpp -o facetlock_core_test && ./facetlock_core_test facetlock_parity.txt
      - name: Facetlock Lattice core, clang
        run: clang++ -std=c++17 -O2 -Wall -Wextra -Wshadow -Werror -I../DaedalusLink/Source/DaedalusLink/Public facetlock_core_test.cpp -o facetlock_core_test_clang && ./facetlock_core_test_clang facetlock_parity.txt
      - name: Prismcairn Duel core (DaedalusPrismcairnCore.h regenerates prismcairn_parity.txt from seed with CPython-compatible seeding)
        run: g++ -std=c++17 -O1 -Wall -Wextra -Wshadow -Werror -fsanitize=address,undefined -I../DaedalusLink/Source/DaedalusLink/Public prismcairn_core_test.cpp -o prismcairn_core_test && ./prismcairn_core_test prismcairn_parity.txt
      - name: Prismcairn Duel core, clang
        run: clang++ -std=c++17 -O2 -Wall -Wextra -Wshadow -Werror -I../DaedalusLink/Source/DaedalusLink/Public prismcairn_core_test.cpp -o prismcairn_core_test_clang && ./prismcairn_core_test_clang prismcairn_parity.txt
      - name: Prismvault Weigh core (DaedalusPrismvaultCore.h regenerates prismvault_parity.txt from seed with CPython-compatible seeding)
        run: g++ -std=c++17 -O1 -Wall -Wextra -Wshadow -Werror -fsanitize=address,undefined -I../DaedalusLink/Source/DaedalusLink/Public prismvault_core_test.cpp -o prismvault_core_test && ./prismvault_core_test prismvault_parity.txt
      - name: Prismvault Weigh core, clang
        run: clang++ -std=c++17 -O2 -Wall -Wextra -Wshadow -Werror -I../DaedalusLink/Source/DaedalusLink/Public prismvault_core_test.cpp -o prismvault_core_test_clang && ./prismvault_core_test_clang prismvault_parity.txt
      - name: Shardfall Gamble core (DaedalusShardfallCore.h regenerates shardfall_parity.txt from seed with CPython-compatible seeding and shuffle)
        run: g++ -std=c++17 -O1 -Wall -Wextra -Wshadow -Werror -fsanitize=address,undefined -I../DaedalusLink/Source/DaedalusLink/Public shardfall_core_test.cpp -o shardfall_core_test && ./shardfall_core_test shardfall_parity.txt
      - name: Shardfall Gamble core, clang
        run: clang++ -std=c++17 -O2 -Wall -Wextra -Wshadow -Werror -I../DaedalusLink/Source/DaedalusLink/Public shardfall_core_test.cpp -o shardfall_core_test_clang && ./shardfall_core_test_clang shardfall_parity.txt
      - name: PyRandom core (DaedalusPyRandomCore.h matches CPython random.Random(str) call by call)
        run: g++ -std=c++17 -O1 -Wall -Wextra -Wshadow -Werror -fsanitize=address,undefined -I../DaedalusLink/Source/DaedalusLink/Public pyrandom_core_test.cpp -o pyrandom_core_test && ./pyrandom_core_test pyrandom_parity.txt
      - name: PyRandom core, clang
        run: clang++ -std=c++17 -O2 -Wall -Wextra -Wshadow -Werror -I../DaedalusLink/Source/DaedalusLink/Public pyrandom_core_test.cpp -o pyrandom_core_test_clang && ./pyrandom_core_test_clang pyrandom_parity.txt
      - name: Prismchime Ring core (DaedalusPrismchimeCore.h regenerates prismchime_parity.txt from seed with CPython-compatible seeding)
        run: g++ -std=c++17 -O1 -Wall -Wextra -Wshadow -Werror -fsanitize=address,undefined -I../DaedalusLink/Source/DaedalusLink/Public prismchime_core_test.cpp -o prismchime_core_test && ./prismchime_core_test prismchime_parity.txt
      - name: Prismchime Ring core, clang
        run: clang++ -std=c++17 -O2 -Wall -Wextra -Wshadow -Werror -I../DaedalusLink/Source/DaedalusLink/Public prismchime_core_test.cpp -o prismchime_core_test_clang && ./prismchime_core_test_clang prismchime_parity.txt
      - name: Fogbell Ferry core (DaedalusFogbellCore.h regenerates fogbell_parity.txt from seed with CPython-compatible seeding)
        run: g++ -std=c++17 -O1 -Wall -Wextra -Wshadow -Werror -fsanitize=address,undefined -I../DaedalusLink/Source/DaedalusLink/Public fogbell_core_test.cpp -o fogbell_core_test && ./fogbell_core_test fogbell_parity.txt
      - name: Fogbell Ferry core, clang
        run: clang++ -std=c++17 -O2 -Wall -Wextra -Wshadow -Werror -I../DaedalusLink/Source/DaedalusLink/Public fogbell_core_test.cpp -o fogbell_core_test_clang && ./fogbell_core_test_clang fogbell_parity.txt
      - name: G206 Census Budget cost model core (DaedalusCensusBudgetCore.h replays census_budget_parity.txt from census_budget.py; 40000/32768 KiB edges)
        run: g++ -std=c++17 -O1 -Wall -Wextra -Wshadow -Werror -fno-exceptions -fno-rtti -fsanitize=address,undefined -I../DaedalusLink/Source/DaedalusLink/Public census_budget_core_test.cpp -o census_budget_core_test && ./census_budget_core_test census_budget_parity.txt
      - name: G206 Census Budget cost model core, clang
        run: clang++ -std=c++17 -O2 -Wall -Wextra -Wshadow -Werror -fno-exceptions -fno-rtti -I../DaedalusLink/Source/DaedalusLink/Public census_budget_core_test.cpp -o census_budget_core_test_clang && ./census_budget_core_test_clang census_budget_parity.txt
      - name: G206 census_budget_parity.txt matches the Python tool
        run: python3 ../../../tools/streaming/census_budget_parity.py --check
      - name: G573 DiskSaver game cores (DaedalusDiskSaver*Core.h replay disksaver_*_parity.txt written by the Python tools)
        run: |
          for t in disksaver_*_core_test.cpp; do n="${t%_core_test.cpp}"; g++ -std=c++17 -O1 -Wall -Wextra -Wshadow -Werror -fno-exceptions -fno-rtti -fsanitize=address,undefined -fno-omit-frame-pointer -I../DaedalusLink/Source/DaedalusLink/Public "$t" -o "$RUNNER_TEMP/$n" && "$RUNNER_TEMP/$n" "${n}_parity.txt" || exit 1; done
      - name: G573 DiskSaver game cores, clang
        run: |
          for t in disksaver_*_core_test.cpp; do n="${t%_core_test.cpp}"; clang++ -std=c++17 -O2 -Wall -Wextra -Wshadow -Werror -fno-exceptions -fno-rtti -I../DaedalusLink/Source/DaedalusLink/Public "$t" -o "$RUNNER_TEMP/$n" && "$RUNNER_TEMP/$n" "${n}_parity.txt" || exit 1; done
      - name: G573 disksaver_*_parity.txt match the Python tools
        run: python3 ../../../tools/streaming/disksaver_cpp_parity.py --check
      - name: LAB03 Echo Bell gate session (AEchoBellGate cue scheduling, taps, judge, retry; replays docs/contracts/echo-bell-v1 CUE-SHEET.md + peals.ebg)
        run: |
          cmp echo_bell/DaedalusEchoBellCore.h ../DaedalusLink/Source/DaedalusLink/Public/DaedalusEchoBellCore.h
          g++ -std=c++17 -O1 -Wall -Wextra -Werror -fsanitize=address,undefined -I../DaedalusLink/Source/DaedalusLink/Public echo_bell/echo_bell_gate_session_test.cpp -o echo_bell_gate_session_test && ./echo_bell_gate_session_test ../../../docs/contracts/echo-bell-v1/CUE-SHEET.md ../../../docs/contracts/echo-bell-v1/peals.ebg
      - name: import script compiles and refuses a non-package
        run: |
          python3 -m py_compile ../DaedalusLink/Content/Python/import_world_package.py ../DaedalusLink/Content/Python/daedalus_view.py ../DaedalusLink/Content/Python/init_unreal.py ../DaedalusLink/Content/Python/daedalus_bridge_commands.py live_parity.py
          echo nope > bad.zip
          if python3 ../DaedalusLink/Content/Python/import_world_package.py bad.zip; then exit 1; fi
      - name: the import verifier can say no
        run: python3 verify_judge_test.py
      - name: runtime data verifier refuses incomplete staging evidence
        run: python3 ../../../tools/unreal/test_runtime_data.py
      - name: realm base-layer cores (land grid, land registry seam, realm session) and their Python twins
        run: |
          for t in land_grid_test land_registry_test realm_directory_test realm_session_test mount_core_test bestiary_core_test; do
            g++ -std=c++17 -O2 -Wall -Wextra -Werror -I../DaedalusLink/Source/DaedalusLink/Public $t.cpp -o $t && ./$t | tail -1
          done
          cd ../DaedalusLink/Content/Python
          for t in test_daedalus_land_grid test_daedalus_layout test_daedalus_plots test_daedalus_realm_ground test_daedalus_land_sync test_daedalus_districts; do
            python3 $t.py | tail -1
          done
      - name: realm deed writer order and committed fixture
        working-directory: tools/realm
        run: |
          python3 test_portal_lands.py
          python3 portal_lands.py --check
      - name: the Claude Unreal connector, end to end against a stand-in editor
        run: |
          C=../../../connectors/claude-unreal-connector
          python3 -m py_compile $C/plugin/ClaudeUnrealBridge/Content/Python/*.py $C/clients/python/unreal_client.py
          (python3 $C/tests/host.py 9911 60 &) ; sleep 2
          node $C/tests/client.js 9911
      - name: DaedalusLink adds its commands through the connector's register()
        run: python3 bridge_commands_test.py

  setup-plan:
    name: setup-unreal.ps1 plan (Windows)
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: parse
        shell: pwsh
        run: |
          $e = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD\engines\unreal\setup-unreal.ps1", [ref]$null, [ref]$e) | Out-Null
          if ($e.Count) { $e; exit 1 }
      - name: plan only
        shell: pwsh
        run: .\engines\unreal\setup-unreal.ps1 -Project "$env:RUNNER_TEMP\Realm\Realm.uproject" -SkipPackage -WhatIfOnly
      - name: preserve GameFeatureData config arrays
        # Config helper tests do not invoke the installer or touch an editor.
        shell: powershell
        run: .\engines\unreal\core-test\game_feature_config_test.ps1
      - name: project and plugin, for real
        shell: powershell
        run: |
          .\engines\unreal\setup-unreal.ps1 -Project "$env:RUNNER_TEMP\Realm\Realm.uproject" -SkipPackage
          $up = Get-Content "$env:RUNNER_TEMP\Realm\Realm.uproject" -Raw | ConvertFrom-Json
          if (-not ($up.Plugins | Where-Object { $_.Name -eq "DaedalusLink" -and $_.Enabled })) { throw "plugin not enabled" }
          if (-not (Test-Path "$env:RUNNER_TEMP\Realm\Plugins\DaedalusLink\DaedalusLink.uplugin")) { throw "plugin not copied" }
