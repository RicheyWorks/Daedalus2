# SPDX-License-Identifier: MIT
name: World package offline preflight
on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/world_package/**'
      - 'engines/unreal/DaedalusLink/Content/Python/import_world_package.py'
      - 'docs/production/WORLD-PACKAGE-PREFLIGHT.md'
      - '.github/workflows/world-package-preflight.yml'
  push:
    branches: [main]
    paths:
      - 'tools/world_package/**'
      - 'engines/unreal/DaedalusLink/Content/Python/import_world_package.py'
      - '.github/workflows/world-package-preflight.yml'
permissions:
  contents: read
concurrency:
  group: world-package-preflight-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - name: Install schema test dependency
        run: python -m pip install 'jsonschema==4.25.1'
      - name: Validate offline package plans and refusal paths
        run: python -m unittest discover -s tools/world_package/tests -p 'test_*.py' -v
