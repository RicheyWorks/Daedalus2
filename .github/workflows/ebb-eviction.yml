# SPDX-License-Identifier: MIT
name: Ebb Tide Eviction
on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/streaming/ebb_eviction.py'
      - 'tools/streaming/ebb_eviction_test.py'
      - 'tools/streaming/ebb_eviction_golden.json'
      - 'tools/streaming/census_budget.py'
      - 'tools/world_census/**'
      - 'data/islands/disk-saver/ebb-eviction-v1.json'
      - 'data/islands/disk-saver/census-budget-v1.json'
      - '.github/workflows/ebb-eviction.yml'
permissions:
  contents: read
jobs:
  ebb-eviction:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - name: G253 Ebb Tide Eviction (exact DP = brute-force oracle, greedy gaps, pinned home, seeded replay, golden from real census)
        run: python -B -m unittest tools/streaming/ebb_eviction_test.py -v
      - name: CLI smoke (real world census -> beacons -> eviction plan)
        run: |
          python -B -m tools.world_census tools/world_census/fixtures/alpha.json tools/world_census/fixtures/beta.json --snapshot-date 2026-10-26 --bindings tools/world_census/fixtures/bindings.json --output-dir "$RUNNER_TEMP/census"
          python tools/streaming/census_budget.py "$RUNNER_TEMP/census/census.json" -o "$RUNNER_TEMP/beacons.json"
          python tools/streaming/ebb_eviction.py "$RUNNER_TEMP/beacons.json" --strict -o "$RUNNER_TEMP/ebb.json"
