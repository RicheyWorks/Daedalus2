name: Retained team check-in inputs

on:
  pull_request:
    paths:
      - connectors/claude-asset-pipeline/asset_pipeline/retained_checkins.py
      - connectors/claude-asset-pipeline/asset_pipeline/team_checkins.py
      - connectors/claude-asset-pipeline/asset_pipeline/__init__.py
      - connectors/claude-asset-pipeline/harness/retained_checkins_test.py
      - .github/workflows/retained-team-checkins.yml
  push:
    branches: [main]
    paths:
      - connectors/claude-asset-pipeline/asset_pipeline/retained_checkins.py
      - connectors/claude-asset-pipeline/asset_pipeline/team_checkins.py
      - connectors/claude-asset-pipeline/asset_pipeline/__init__.py
      - connectors/claude-asset-pipeline/harness/retained_checkins_test.py
      - .github/workflows/retained-team-checkins.yml

permissions:
  contents: read

jobs:
  retained-inputs:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Synthetic retained inputs through unchanged reducer
        working-directory: connectors/claude-asset-pipeline
        run: python -B harness/retained_checkins_test.py
