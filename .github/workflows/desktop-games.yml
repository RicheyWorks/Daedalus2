name: Desktop Python game ports
on:
  pull_request:
    paths: ["engines/unreal/DaedalusLink/Source/DaedalusLink/**Desktop*", "engines/unreal/DaedalusLink/Source/DaedalusLink/Public/DesktopGames/**", "engines/unreal/core-test/desktop_games/**", "docs/desktop-games-sources.json", "tools/minigames/**", "engines/unreal/core-test/fair_par_guard.txt", "docs/minigames/**", "docs/REALMS.md", "data/minigames/**", ".github/workflows/desktop-games.yml"]
  push:
    branches: [main]
    paths: ["engines/unreal/DaedalusLink/Source/DaedalusLink/**Desktop*", "engines/unreal/DaedalusLink/Source/DaedalusLink/Public/DesktopGames/**", "engines/unreal/core-test/desktop_games/**", "tools/minigames/**", "engines/unreal/core-test/fair_par_guard.txt", "docs/minigames/**", "docs/REALMS.md", "data/minigames/**", ".github/workflows/desktop-games.yml"]
permissions:
  contents: read
concurrency:
  group: desktop-games-${{ github.ref }}
  cancel-in-progress: true
jobs:
  portable-games:
    name: Desktop game parity (${{ matrix.compiler }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            compiler: gcc
            cxx: g++
          - os: ubuntu-latest
            compiler: clang
            cxx: clang++
          - os: windows-latest
            compiler: msvc
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      # ccache (item 19): the gcc sanitizer compile is the slowest step
      # (450-595 s on the runs that needed reruns); cache objects per compiler.
      - name: Compiler cache (Linux)
        if: runner.os == 'Linux'
        uses: hendrikmuhs/ccache-action@5ebbd400eff9e74630f759d94ddd7b6c26299639 # v1.2
        with:
          key: desktop-games-${{ matrix.compiler }}
          max-size: 500M
      - name: Configure Linux with sanitizers
        if: runner.os == 'Linux'
        run: cmake -S engines/unreal/core-test/desktop_games -B desktop-build -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DDESKTOP_SANITIZERS=ON
      - name: Configure MSVC
        if: runner.os == 'Windows'
        run: cmake -S engines/unreal/core-test/desktop_games -B desktop-build
      - name: Minigame catalog is current
        run: python tools/minigames/minigame_catalog.py --check
      - name: Every cabinet has a save slot, how-to line, scoreboard entry and an original name
        run: python tools/minigames/catalog_validate.py
      - name: Every minigame C++ core has a parity fixture and a CI core test
        run: python tools/minigames/minigame_core_parity.py --check
      - name: Leaderboard feed hook matches the catalog and does not post
        run: python tools/minigames/leaderboard_feed.py --check
      - name: Shardring parity fixture is current (engines/unreal/core-test/shardring_parity.txt)
        run: python tools/minigames/shardring_parity.py --check
      - name: Lumenpath parity fixture is current (engines/unreal/core-test/lumenpath_parity.txt)
        run: python tools/minigames/lumenpath_parity.py --check
      - name: Shadewatch parity fixture is current (engines/unreal/core-test/shadewatch_parity.txt)
        run: python tools/minigames/shadewatch_parity.py --check
      - name: Glimmerloom parity fixture is current (engines/unreal/core-test/glimmerloom_parity.txt)
        run: python tools/minigames/glimmerloom_parity.py --check
      - name: Prismchime parity fixture is current (engines/unreal/core-test/prismchime_parity.txt)
        run: python tools/minigames/prismchime_parity.py --check
      - name: Fogbell parity fixture is current (engines/unreal/core-test/fogbell_parity.txt)
        run: python tools/minigames/fogbell_parity.py --check
      - name: Roostcall parity fixture is current (engines/unreal/core-test/roostcall_parity.txt)
        run: python tools/minigames/roostcall_parity.py --check
      - name: Emberkiln parity fixture is current (engines/unreal/core-test/emberkiln_parity.txt)
        run: python tools/minigames/emberkiln_parity.py --check
      - name: Sluicegate parity fixture is current (engines/unreal/core-test/sluicegate_parity.txt)
        run: python tools/minigames/sluicegate_parity.py --check
      - name: Shardscale parity fixture is current (engines/unreal/core-test/shardscale_parity.txt)
        run: python tools/minigames/shardscale_parity.py --check
      - name: Stonecourse parity fixture is current (engines/unreal/core-test/stonecourse_parity.txt)
        run: python tools/minigames/stonecourse_parity.py --check
      - name: Dyevat parity fixture is current (engines/unreal/core-test/dyevat_parity.txt)
        run: python tools/minigames/dyevat_parity.py --check
      - name: Glimmerloom parity fixture is current (engines/unreal/core-test/glimmerloom_parity.txt)
        run: python tools/minigames/glimmerloom_parity.py --check
      - name: Spiritkite parity fixture is current (engines/unreal/core-test/spiritkite_parity.txt)
        run: python tools/minigames/spiritkite_parity.py --check
      - name: Glowmoss parity fixture is current (engines/unreal/core-test/glowmoss_parity.txt)
        run: python tools/minigames/glowmoss_parity.py --check
      - name: Prismheart Fair Par fixture is current (engines/unreal/core-test/prism_fair_par_parity.txt)
        run: python tools/minigames/fair_par.py --check
      - name: Fair Par regression guard (no par may move from the hand-kept engines/unreal/core-test/fair_par_guard.txt)
        run: python tools/minigames/fair_par.py --guard
      - name: Prism Satchel parity fixture is current (engines/unreal/core-test/prism_satchel_parity.txt)
        run: python tools/minigames/prism_satchel_parity.py --check
      - name: Prism Looks parity fixture is current (engines/unreal/core-test/prism_looks_parity.txt)
        run: python tools/minigames/prism_looks_parity.py --check
      - name: Wardens' Accord parity fixture is current (engines/unreal/core-test/wardens_accord_parity.txt)
        run: python tools/minigames/wardens_accord_parity.py --check
      - name: Facetlock parity fixture is current (engines/unreal/core-test/facetlock_parity.txt)
        run: python tools/minigames/facetlock_parity.py --check
      - name: Prismcairn parity fixture is current (engines/unreal/core-test/prismcairn_parity.txt)
        run: python tools/minigames/prismcairn_parity.py --check
      - name: Prismvault parity fixture is current (engines/unreal/core-test/prismvault_parity.txt)
        run: python tools/minigames/prismvault_parity.py --check
      - name: Shardfall parity fixture is current (engines/unreal/core-test/shardfall_parity.txt)
        run: python tools/minigames/shardfall_parity.py --check
      - name: Siltlane parity fixture is current (engines/unreal/core-test/siltlane_parity.txt)
        run: python tools/minigames/siltlane_parity.py --check
      - name: PyRandom parity fixture is current (engines/unreal/core-test/pyrandom_parity.txt)
        run: python tools/minigames/pyrandom_parity.py --check
      - name: Shadewatch parity fixture is current (engines/unreal/core-test/shadewatch_parity.txt)
        run: python tools/minigames/shadewatch_parity.py --check
      - name: Realm cabinet placements are current and tested
        run: |
          python tools/minigames/realm_cabinets.py --check
          python -m unittest discover -s tools/minigames -p "test_*.py" -v
      - name: Compile
        run: cmake --build desktop-build --config Debug --parallel 4
      - name: Replay actual source fixtures and lifecycle checks
        run: ctest --test-dir desktop-build -C Debug --output-on-failure
      - name: Native source preflight
        run: >-
          python tools/unreal_preflight/preflight.py
          engines/unreal/DaedalusLink/Source/DaedalusLink/Public/DesktopGames
          engines/unreal/DaedalusLink/Source/DaedalusLink/Public/DaedalusDesktopArcade.h
          engines/unreal/DaedalusLink/Source/DaedalusLink/Private/DaedalusDesktopArcade.cpp
          engines/unreal/DaedalusLink/Source/DaedalusLink/Private/SDaedalusDesktopArcade.h
          engines/unreal/DaedalusLink/Source/DaedalusLink/Private/SDaedalusDesktopArcade.cpp
      - name: Validate source inventory
        run: python -c "import json; d=json.load(open('docs/desktop-games-sources.json')); assert len(d['games'])==11; assert len({g['id'] for g in d['games']})==11; assert all(len(g['sha256'])==64 for g in d['games'])"
# CI replays synthetic fixtures produced by reviewed source fragments. It cannot
# read the user's private Desktop or establish Unreal compilation/live gameplay.
