# SPDX-License-Identifier: MIT
name: Driftwood Codes
on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/streaming/driftwood_codes.py'
      - 'tools/streaming/driftwood_codes_test.py'
      - 'tools/streaming/tide_chart_cache.py'
      - 'data/islands/disk-saver/driftwood-codes-v1.json'
      - 'data/islands/disk-saver/tide-chart-v1.json'
      - '.github/workflows/driftwood-codes.yml'
permissions:
  contents: read
jobs:
  driftwood-codes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - name: G76 Driftwood Codes rules (Huffman optimum, trap, prefix codes round trip, G70 tie-in)
        run: python -m unittest tools/streaming/driftwood_codes_test.py -v
      - name: CLI smoke (Huffman raft wins)
        run: python tools/streaming/driftwood_codes.py data/islands/disk-saver/driftwood-codes-v1.json
