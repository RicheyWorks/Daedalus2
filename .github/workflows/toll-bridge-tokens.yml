# SPDX-License-Identifier: MIT
name: Toll Bridge Tokens
on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/streaming/toll_bridge_tokens.py'
      - 'tools/streaming/toll_bridge_tokens_test.py'
      - 'data/islands/disk-saver/toll-bridge-tokens-v1.json'
      - 'data/islands/disk-saver/compaction-shoals-v1.json'
      - 'tools/streaming/breakwater_queue.py'
      - 'data/islands/disk-saver/breakwater-queue-v1.json'
      - '.github/workflows/toll-bridge-tokens.yml'
permissions:
  contents: read
jobs:
  toll-bridge-tokens:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - name: G158 Toll Bridge Tokens rules (token bucket envelope, fixed-window boundary burst, solver = brute force, G126 tie-in)
        run: python -m unittest tools/streaming/toll_bridge_tokens_test.py -v
      - name: CLI smoke (sized token bucket wins)
        run: python tools/streaming/toll_bridge_tokens.py data/islands/disk-saver/toll-bridge-tokens-v1.json
