name: Realm land grid parity
on:
  pull_request:
    paths:
      - 'daedalus-core/src/main/java/com/daedalus/world/RealmLandGrid.java'
      - 'engines/unreal/DaedalusLink/Source/DaedalusLink/Public/DaedalusLandGridCore.h'
      - 'engines/unreal/core-test/*[Gg]rid*'
      - '.github/workflows/land-grid.yml'
  push:
    branches: [main, codex/realm-land-grid]
    paths:
      - 'daedalus-core/src/main/java/com/daedalus/world/RealmLandGrid.java'
      - 'engines/unreal/DaedalusLink/Source/DaedalusLink/Public/DaedalusLandGridCore.h'
      - 'engines/unreal/core-test/*[Gg]rid*'
      - '.github/workflows/land-grid.yml'
permissions:
  contents: read
concurrency:
  group: land-grid-${{ github.ref }}
  cancel-in-progress: true
jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        compiler: [g++, clang++]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: python3 engines/unreal/core-test/run_land_grid_checks.py --compiler ${{ matrix.compiler }} --sanitize
  windows:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do call "%%i\VC\Auxiliary\Build\vcvars64.bat"
          python engines/unreal/core-test/run_land_grid_checks.py --compiler cl
