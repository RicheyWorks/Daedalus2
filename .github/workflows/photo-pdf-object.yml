# SPDX-License-Identifier: MIT
# Portable policy checks only. Real Unreal UHT/UBT and live object playtests require a separate engine host.
name: Photo PDF object policy

on:
  push:
    branches: [main]
    paths:
      - "engines/unreal/DaedalusLink/Source/DaedalusLink/Public/DaedalusPhotoPdf*.h"
      - "engines/unreal/DaedalusLink/Source/DaedalusLink/Private/DaedalusPhotoPdf*.cpp"
      - "engines/unreal/core-test/photo_pdf_core_test.cpp"
      - "engines/unreal/core-test/run_photo_pdf_core.cmd"
      - ".github/workflows/photo-pdf-object.yml"
  pull_request:
    paths:
      - "engines/unreal/DaedalusLink/Source/DaedalusLink/Public/DaedalusPhotoPdf*.h"
      - "engines/unreal/DaedalusLink/Source/DaedalusLink/Private/DaedalusPhotoPdf*.cpp"
      - "engines/unreal/core-test/photo_pdf_core_test.cpp"
      - "engines/unreal/core-test/run_photo_pdf_core.cmd"
      - ".github/workflows/photo-pdf-object.yml"

concurrency:
  group: photo-pdf-object-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  portable-linux:
    name: URL and interaction policy (${{ matrix.compiler }})
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        compiler: [g++, clang++]
    defaults:
      run:
        working-directory: engines/unreal/core-test
    steps:
      - uses: actions/checkout@v7
      - name: Build and run with address and undefined-behavior sanitizers
        run: |
          ${{ matrix.compiler }} -std=c++17 -O1 -g -Wall -Wextra -Wshadow -Werror -fsanitize=address,undefined -fno-omit-frame-pointer -I../DaedalusLink/Source/DaedalusLink/Public photo_pdf_core_test.cpp -o photo_pdf_core_test
          ./photo_pdf_core_test

  portable-windows:
    name: URL and interaction policy (MSVC)
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Build and run MSVC with warnings as errors
        shell: cmd
        run: engines\unreal\core-test\run_photo_pdf_core.cmd "%RUNNER_TEMP%\photo-pdf-object"
