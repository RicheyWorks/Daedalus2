# SPDX-License-Identifier: MIT
# Engine-free C++17 sidecar reader (engines/sidecar_cpp): build + run against the committed real-sidecar fixtures.
name: Sidecar C++
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'engines/sidecar_cpp/**'
      - '.github/workflows/sidecar-cpp.yml'
permissions:
  contents: read
jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: configure
        run: cmake -S engines/sidecar_cpp -B build/sidecar -DCMAKE_BUILD_TYPE=Release
      - name: build
        run: cmake --build build/sidecar --config Release
      - name: test
        run: ctest --test-dir build/sidecar -C Release --output-on-failure
