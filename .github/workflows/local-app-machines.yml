# SPDX-License-Identifier: MIT
# Portable policy and original photo regressions. Engine compilation/Play acceptance are separate.
name: Local app machine policy

on:
  push:
    branches: [main]
    paths:
      - "engines/unreal/DaedalusLink/Source/DaedalusLink/Public/DaedalusLocalApp*.h"
      - "engines/unreal/DaedalusLink/Source/DaedalusLink/Private/DaedalusLocalApp*"
      - "engines/unreal/DaedalusLink/Source/DaedalusLink/Public/DaedalusPhotoPdf*.h"
      - "engines/unreal/DaedalusLink/Source/DaedalusLink/Private/DaedalusPhotoPdfMachine.cpp"
      - "engines/unreal/core-test/local_app_core_test.cpp"
      - "engines/unreal/core-test/run_local_app_core.cmd"
      - "engines/unreal/core-test/photo_pdf_core_test.cpp"
      - "engines/unreal/core-test/run_photo_pdf_core.cmd"
      - ".github/workflows/local-app-machines.yml"
  pull_request:
    paths:
      - "engines/unreal/DaedalusLink/Source/DaedalusLink/Public/DaedalusLocalApp*.h"
      - "engines/unreal/DaedalusLink/Source/DaedalusLink/Private/DaedalusLocalApp*"
      - "engines/unreal/DaedalusLink/Source/DaedalusLink/Public/DaedalusPhotoPdf*.h"
      - "engines/unreal/DaedalusLink/Source/DaedalusLink/Private/DaedalusPhotoPdfMachine.cpp"
      - "engines/unreal/core-test/local_app_core_test.cpp"
      - "engines/unreal/core-test/run_local_app_core.cmd"
      - "engines/unreal/core-test/photo_pdf_core_test.cpp"
      - "engines/unreal/core-test/run_photo_pdf_core.cmd"
      - ".github/workflows/local-app-machines.yml"

concurrency:
  group: local-app-machines-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  portable-linux:
    name: Typed URLs and photo regressions (${{ matrix.compiler }})
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        compiler: [g++, clang++]
    defaults:
      run:
        working-directory: engines/unreal/core-test
    steps:
      - uses: actions/checkout@v4
      - name: Build and run with sanitizers
        run: |
          for source in photo_pdf_core_test local_app_core_test; do
            ${{ matrix.compiler }} -std=c++17 -O1 -g -Wall -Wextra -Wshadow -Werror -fsanitize=address,undefined -fno-omit-frame-pointer -I../DaedalusLink/Source/DaedalusLink/Public "$source.cpp" -o "$source"
            ./"$source"
          done

  portable-windows:
    name: Typed URLs and photo regressions (MSVC)
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Build and run both with warnings as errors
        shell: cmd
        run: engines\unreal\core-test\run_local_app_core.cmd "%RUNNER_TEMP%\local-app-machines"
