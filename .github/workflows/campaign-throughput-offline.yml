# SPDX-License-Identifier: MIT
name: Campaign throughput offline
on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/campaign_throughput_toolkit/**'
      - 'tools/unreal_mcp/native_validation_snapshot_consumer.py'
      - '.github/workflows/campaign-throughput-offline.yml'
  push:
    branches: [main]
    paths:
      - 'tools/campaign_throughput_toolkit/**'
      - 'tools/unreal_mcp/native_validation_snapshot_consumer.py'
      - '.github/workflows/campaign-throughput-offline.yml'
permissions:
  contents: read
concurrency:
  group: campaign-throughput-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - name: Check synthetic source contracts
        run: python -B -m unittest discover -s tools/campaign_throughput_toolkit -t . -p 'test_*.py' -v
      - name: Install shared pinned linter
        run: >-
          python -m pip install --disable-pip-version-check --only-binary=:all:
          --requirement tools/python_quality/requirements-lint.txt
      - name: Check new toolkit source
        run: python -m ruff check --config tools/python_quality/ruff.toml --no-respect-gitignore tools/campaign_throughput_toolkit
