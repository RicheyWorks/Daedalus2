name: Portable team check-ins

on:
  pull_request:
    paths:
      - connectors/claude-asset-pipeline/asset_pipeline/team_checkins.py
      - connectors/claude-asset-pipeline/asset_pipeline/__init__.py
      - connectors/claude-asset-pipeline/harness/team_checkins_test.py
      - connectors/claude-asset-pipeline/docs/team-checkins.md
      - .github/workflows/team-checkins.yml
  push:
    branches: [main]
    paths:
      - connectors/claude-asset-pipeline/asset_pipeline/team_checkins.py
      - connectors/claude-asset-pipeline/asset_pipeline/__init__.py
      - connectors/claude-asset-pipeline/harness/team_checkins_test.py
      - connectors/claude-asset-pipeline/docs/team-checkins.md
      - .github/workflows/team-checkins.yml

permissions:
  contents: read

jobs:
  portable-checkins:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Retained assignment and checkpoint contracts
        working-directory: connectors/claude-asset-pipeline
        run: python -B harness/team_checkins_test.py
