# SPDX-License-Identifier: MIT
name: leading-lights
on:
  push:
    branches: [main]
    paths:
      - 'tools/streaming/leading_lights*.py'
      - 'data/islands/disk-saver/leading-lights-v1.json'
      - 'docs/islands/**'
      - 'tools/streaming/**.md'
  pull_request:
    paths:
      - 'tools/streaming/leading_lights*.py'
      - 'data/islands/disk-saver/leading-lights-v1.json'
      - 'docs/islands/**'
      - 'tools/streaming/**.md'
permissions:
  contents: read
jobs:
  leading-lights:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - run: python -B -m unittest tools/streaming/leading_lights_test.py -v
      - run: python -B tools/streaming/leading_lights.py --under docs/islands --fail-on dark
      - run: python -B tools/streaming/leading_lights.py --under tools/streaming --fail-on dark
      - run: python -B tools/streaming/leading_lights.py