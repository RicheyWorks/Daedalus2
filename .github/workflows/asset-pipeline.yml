name: Asset pipeline identity
on:
  pull_request:
    paths:
      - 'connectors/claude-asset-pipeline/**'
      - '.github/workflows/asset-pipeline.yml'
permissions:
  contents: read
jobs:
  offline:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    defaults:
      run:
        working-directory: connectors/claude-asset-pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python harness/artifact_identity_test.py
      - run: python harness/glb_test.py
      - run: python harness/judge_test.py
      - run: python harness/combat_handoff_test.py
      - run: python harness/combat_report_test.py
