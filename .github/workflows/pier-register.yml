# SPDX-License-Identifier: MIT
name: Pier Register
on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/streaming/**'
      - 'data/islands/disk-saver/**'
      - 'docs/islands/DISKSAVER-*.md'
      - '.github/workflows/pier-register.yml'
permissions:
  contents: read
jobs:
  pier-register:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - name: G534 Pier Register (every finding kind, name checks, counts = brute force, real repo, CLI)
        run: python -B -m unittest tools/streaming/pier_register_test.py -v
      - name: Read the real DiskSaver register (--fail-on unregistered)
        run: python tools/streaming/pier_register.py --fail-on unregistered