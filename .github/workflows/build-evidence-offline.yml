name: Offline build evidence capture
on:
  pull_request:
    paths:
      - 'tools/build_evidence/**'
      - 'tools/team_handoff/packet.py'
      - 'tools/team_handoff/contracts.py'
      - 'tools/team_handoff/schemas/build-inputs.schema.json'
      - 'tools/team_handoff/schemas/build-provenance.schema.json'
      - 'tools/python_quality/requirements-lint.txt'
      - 'tools/python_quality/ruff.toml'
      - '.github/workflows/build-evidence-offline.yml'
  push:
    branches: [main]
    paths:
      - 'tools/build_evidence/**'
      - 'tools/team_handoff/packet.py'
      - 'tools/team_handoff/contracts.py'
      - 'tools/team_handoff/schemas/build-inputs.schema.json'
      - 'tools/team_handoff/schemas/build-provenance.schema.json'
      - 'tools/python_quality/requirements-lint.txt'
      - 'tools/python_quality/ruff.toml'
      - '.github/workflows/build-evidence-offline.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  capture-fixtures:
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.10'
          - os: windows-latest
            python: '3.12'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: tools/python_quality/requirements-lint.txt
      - name: Pinned validation tools
        run: >-
          python -m pip install --only-binary=:all:
          --requirement tools/python_quality/requirements-lint.txt jsonschema==4.26.0
      - name: Explicit namespace static analysis
        run: python -m ruff check --config tools/python_quality/ruff.toml --no-respect-gitignore tools/build_evidence
      - name: Serial synthetic capture and existing sealing compatibility
        run: python -B -m unittest tools.build_evidence.test_capture -v
