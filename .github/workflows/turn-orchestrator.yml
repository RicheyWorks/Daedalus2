name: Turn orchestrator

on:
  push:
    branches: [main]
    paths: ['tools/claude_island/turn_unreal_team*.py', '.github/workflows/turn-orchestrator.yml']
  pull_request:
    branches: [main]
    paths: ['tools/claude_island/turn_unreal_team*.py', '.github/workflows/turn-orchestrator.yml']

permissions:
  contents: read

jobs:
  offline-turn:
    name: Offline turn and checkpoint (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Existing turn workflow regressions
        run: python tools/claude_island/turn_unreal_team_test.py
      - name: Truthful status and durable checkpoint regressions
        run: python tools/claude_island/turn_unreal_team_progress_test.py
