name: Ocean host API
on:
  pull_request:
    paths:
      - 'daedalus-core/src/**/ocean/**'
      - 'daedalus-server/src/**/OceanHost*'
      - 'daedalus-server/src/main/resources/application.yml'
      - 'daedalus-server/src/test/**/ProdAuthPostureTest.java'
      - '.github/workflows/ocean-host.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  host:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Production HTTP, JWT, quota, restart, API posture and Ocean regressions
        shell: bash
        run: mvn -B -ntp -pl daedalus-server -am '-Dtest=OceanHostTest,OceanHostHttpRestartTest,Ocean*Test,ProdAuthPostureTest,ErrorContractTest' -Dsurefire.failIfNoSpecifiedTests=false test
