# SPDX-License-Identifier: MIT
name: Save Vault Keeper
on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/streaming/save_vault.py'
      - 'tools/streaming/save_vault_test.py'
      - 'data/islands/disk-saver/save-vault-v1.json'
      - 'data/islands/disk-saver/byte-spring-v1.json'
      - '.github/workflows/save-vault.yml'
permissions:
  contents: read
jobs:
  save-vault:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - name: G59 Save Vault rules (validation, pinned/loss rules, seeded runs, G39 tie-in)
        run: python -m unittest tools/streaming/save_vault_test.py -v
      - name: CLI smoke (seed 1 wins)
        run: python tools/streaming/save_vault.py data/islands/disk-saver/save-vault-v1.json --seed 1
