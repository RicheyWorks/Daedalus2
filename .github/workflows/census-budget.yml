# SPDX-License-Identifier: MIT
name: Census Budget Beacons
on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/streaming/census_budget.py'
      - 'tools/streaming/census_budget_test.py'
      - 'tools/streaming/census_budget_golden.json'
      - 'tools/streaming/dsb_manifest.py'
      - 'tools/world_census/**'
      - 'data/islands/disk-saver/census-budget-v1.json'
      - '.github/workflows/census-budget.yml'
permissions:
  contents: read
jobs:
  census-budget:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - name: G206 Census Budget Beacons (cost = DSB estimate, exact budget edges, greedy = brute-force oracle, seeded replay, golden report from real census)
        run: python -B -m unittest tools/streaming/census_budget_test.py -v
      - name: CLI smoke (real world census -> beacons)
        run: |
          python -B -m tools.world_census tools/world_census/fixtures/alpha.json tools/world_census/fixtures/beta.json --snapshot-date 2026-10-26 --bindings tools/world_census/fixtures/bindings.json --output-dir "$RUNNER_TEMP/census"
          python tools/streaming/census_budget.py "$RUNNER_TEMP/census/census.json" --strict -o "$RUNNER_TEMP/beacons.json"