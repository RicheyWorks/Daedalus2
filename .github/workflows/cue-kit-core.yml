name: Prismheart cue kits core
on:
  pull_request:
    paths:
      - 'engines/unreal/**/DaedalusCueKitCore.h'
      - 'engines/unreal/**/DaedalusEarRuleCore.h'
      - 'engines/unreal/core-test/cue_kit_core_test.cpp'
      - 'engines/unreal/core-test/cue_kit_golden.txt'
      - 'engines/unreal/core-test/cue_kit_golden_v2.txt'
      - 'engines/unreal/**/DaedalusPyRandomCore.h'
      - 'tools/minigames/cue_kit.py'
      - '.github/workflows/cue-kit-core.yml'
  push:
    branches: [main]
    paths:
      - 'engines/unreal/**/DaedalusCueKitCore.h'
      - 'engines/unreal/**/DaedalusEarRuleCore.h'
      - 'engines/unreal/core-test/cue_kit_core_test.cpp'
      - 'engines/unreal/core-test/cue_kit_golden.txt'
      - 'engines/unreal/core-test/cue_kit_golden_v2.txt'
      - 'engines/unreal/**/DaedalusPyRandomCore.h'
      - 'tools/minigames/cue_kit.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  parity:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        compiler: [g++, clang++]
    steps:
      - uses: actions/checkout@v4
      - name: Cue kit golden vectors + properties (sanitized, no FMA contraction)
        run: |
          ${{ matrix.compiler }} -std=c++17 -O1 -Wall -Wextra -Werror -ffp-contract=off -fsanitize=address,undefined -fno-omit-frame-pointer engines/unreal/core-test/cue_kit_core_test.cpp -o "$RUNNER_TEMP/cue_kit"
          "$RUNNER_TEMP/cue_kit" engines/unreal/core-test/cue_kit_golden.txt
      - name: V2 golden matches the Python rules reference
        run: |
          python3 tools/minigames/cue_kit.py --write "$RUNNER_TEMP/cue_kit_golden_v2.txt"
          cmp "$RUNNER_TEMP/cue_kit_golden_v2.txt" engines/unreal/core-test/cue_kit_golden_v2.txt
  msvc:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Cue kit golden vectors + properties (MSVC cl /W4 /WX /fp:strict)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $out = Join-Path $env:RUNNER_TEMP 'cue_kit'
          New-Item -ItemType Directory -Force $out | Out-Null
          cl /nologo /std:c++17 /EHsc /W4 /WX /fp:strict engines/unreal/core-test/cue_kit_core_test.cpp "/Fo$out\cue_kit.obj" "/Fe$out\cue_kit.exe"
          if ($LASTEXITCODE) { throw "cl failed ($LASTEXITCODE)" }
          & "$out\cue_kit.exe" engines/unreal/core-test/cue_kit_golden.txt
          if ($LASTEXITCODE) { throw "cue_kit_core_test failed ($LASTEXITCODE)" }
