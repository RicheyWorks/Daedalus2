name: Game port rules

on:
  pull_request:
    paths:
      - "engines/unreal/DaedalusLink/Source/DaedalusLink/**Minesweeper*"
      - "engines/unreal/DaedalusLink/Source/DaedalusLink/**PetCare*"
      - "engines/unreal/core-test/**"
      - ".github/workflows/game-ports.yml"
  push:
    branches: [main]
    paths:
      - "engines/unreal/DaedalusLink/Source/DaedalusLink/**Minesweeper*"
      - "engines/unreal/DaedalusLink/Source/DaedalusLink/**PetCare*"
      - "engines/unreal/core-test/**"
      - ".github/workflows/game-ports.yml"

permissions:
  contents: read

concurrency:
  group: game-ports-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable-rules:
    name: Game rule parity (${{ matrix.compiler }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            compiler: gcc
            cxx: g++
          - os: ubuntu-latest
            compiler: clang
            cxx: clang++
          - os: windows-latest
            compiler: msvc
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Configure Linux with ASan and UBSan
        if: runner.os == 'Linux'
        run: cmake -S engines/unreal/core-test -B game-port-build -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} -DGAME_PORT_SANITIZERS=ON
      - name: Configure MSVC
        if: runner.os == 'Windows'
        run: cmake -S engines/unreal/core-test -B game-port-build
      - name: Compile portable rules (warnings are errors)
        run: cmake --build game-port-build --config Debug
      - name: Replay pinned source fixtures
        run: ctest --test-dir game-port-build -C Debug --output-on-failure
      - name: Unreal source preflight (not an Unreal compile)
        run: python tools/unreal_preflight/preflight.py engines/unreal/DaedalusLink/Source/DaedalusLink/Public/DaedalusMinesweeperCore.h engines/unreal/DaedalusLink/Source/DaedalusLink/Public/DaedalusMinesweeper.h engines/unreal/DaedalusLink/Source/DaedalusLink/Public/DaedalusPetCareCore.h engines/unreal/DaedalusLink/Source/DaedalusLink/Private/DaedalusMinesweeper.cpp engines/unreal/DaedalusLink/Source/DaedalusLink/Private/SDaedalusMinesweeper.h engines/unreal/DaedalusLink/Source/DaedalusLink/Private/SDaedalusMinesweeper.cpp
      - name: Source oracle scripts parse
        run: python -m py_compile engines/unreal/core-test/minesweeper_source_oracle.py engines/unreal/core-test/pet_care_source_oracle.py

# Fixtures were generated by executing the pinned Java/Python source locally.
# CI replays the committed fixtures; it does not have access to private source repos.
# UE 5.8 UHT/UBT, editor placement and live gameplay are Claude's separate acceptance.
