# SPDX-License-Identifier: MIT
name: Memory Footprint Report
on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/streaming/memory_footprint.py'
      - 'tools/streaming/memory_footprint_test.py'
      - 'tools/streaming/census_budget.py'
      - 'tools/world_census/**'
      - 'data/islands/disk-saver/memory-footprint-v1.json'
      - 'data/islands/disk-saver/census-budget-v1.json'
      - '.github/workflows/memory-footprint.yml'
permissions:
  contents: read
jobs:
  memory-footprint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - name: G519 Memory Footprint Report (G206 parity, top consumers and wins = brute force, tools, CLI)
        run: python -B -m unittest tools/streaming/memory_footprint_test.py -v
      - name: Footprint of the real world census (--fail-on-over)
        run: |
          python -B -m tools.world_census tools/world_census/fixtures/alpha.json tools/world_census/fixtures/beta.json --snapshot-date 2026-10-26 --bindings tools/world_census/fixtures/bindings.json --output-dir "$RUNNER_TEMP/census"
          python tools/streaming/memory_footprint.py "$RUNNER_TEMP/census/census.json" --fail-on-over