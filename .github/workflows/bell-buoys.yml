# SPDX-License-Identifier: MIT
name: Bell Buoys
on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/streaming/**'
      - 'data/islands/disk-saver/**'
      - '.github/workflows/**'
permissions:
  contents: read
jobs:
  bell-buoys:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - name: G538 Bell Buoys (paths parsing, glob = reference matcher, every finding kind, real repo, CLI)
        run: python -B -m unittest tools/streaming/bell_buoys_test.py -v
      - name: Streaming workflows must ring (--under tools/streaming --fail-on silent)
        run: python tools/streaming/bell_buoys.py --under tools/streaming --fail-on silent
      - name: Whole-repo report (information only)
        run: python tools/streaming/bell_buoys.py