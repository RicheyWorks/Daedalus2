name: Restore world verification
on:
  pull_request:
    paths:
      - 'deploy/restore-drill.sh'
      - 'deploy/restore_manifest.py'
      - 'deploy/test_restore_manifest.py'
      - '.github/workflows/restore-drill.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sh -n deploy/restore-drill.sh
      - run: python3 deploy/test_restore_manifest.py
