# SPDX-License-Identifier: MIT
name: belfry-changes
on:
  push:
    branches: [main]
    paths:
      - 'tools/streaming/belfry_changes*.py'
      - 'tools/streaming/census_budget.py'
      - 'tools/world_census/**'
      - 'data/islands/disk-saver/belfry-changes-v1.json'
  pull_request:
    paths:
      - 'tools/streaming/belfry_changes*.py'
      - 'tools/streaming/census_budget.py'
      - 'tools/world_census/**'
      - 'data/islands/disk-saver/belfry-changes-v1.json'
permissions:
  contents: read
jobs:
  belfry-changes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - run: python -B -m unittest tools/streaming/belfry_changes_test.py -v
      - run: |
          python -B -m tools.world_census tools/world_census/fixtures/alpha.json tools/world_census/fixtures/beta.json --snapshot-date 2026-10-26 --bindings tools/world_census/fixtures/bindings.json --output-dir "$RUNNER_TEMP/census"
          python -B tools/streaming/belfry_changes.py "$RUNNER_TEMP/census/census.json" --seed 7 --auto
