name: Bridge lifecycle

on:
  pull_request:
    branches: [main]
    paths:
      - "connectors/claude-unreal-connector/**"
      - ".github/workflows/bridge-lifecycle.yml"
  push:
    branches: [main]
    paths:
      - "connectors/claude-unreal-connector/**"
      - ".github/workflows/bridge-lifecycle.yml"

permissions:
  contents: read

jobs:
  offline:
    name: Offline lifecycle (${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Interrupted and repeated lifecycle checks (no sockets)
        run: python connectors/claude-unreal-connector/tests/bridge_lifecycle_test.py
      - name: Existing transport contract against the stand-in editor
        working-directory: connectors/claude-unreal-connector
        run: python -m harness.contract
      - name: Existing discovery walk against the stand-in editor
        working-directory: connectors/claude-unreal-connector
        run: python -m harness.walk --standin
      - name: Daedalus command registration and yielding steps
        working-directory: engines/unreal/core-test
        run: python bridge_commands_test.py
