# SPDX-License-Identifier: MIT
name: Prismheart field spell checks
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'tools/rpg_demo/index.html'
      - 'tools/rpg_demo/journey-save.js'
      - 'tools/rpg_demo/field_spell_info_test.js'
      - 'tools/rpg_demo/field_spell_target_test.js'
      - 'tools/rpg_demo/field_spellbook_test.js'
      - 'data/rpg/party.json'
      - 'data/rpg/interiors.json'
      - 'data/rpg/spells.json'
      - 'data/rpg/menus.json'
      - 'data/rpg/prism-fish.json'
      - 'data/rpg/prism-bosses.json'
      - '.github/workflows/prism-field-spells.yml'
permissions:
  contents: read
jobs:
  field-spell-source-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      # Existing VM checks use fake storage/controller/canvas peers, with no browser or native runtime.
      - name: Field spell information and resource rules
        run: node --max-old-space-size=128 tools/rpg_demo/field_spell_info_test.js
      - name: Field spell recipients and input priority
        run: node --max-old-space-size=128 tools/rpg_demo/field_spell_target_test.js
      - name: Field spellbook selection and casting previews
        run: node --max-old-space-size=128 tools/rpg_demo/field_spellbook_test.js
