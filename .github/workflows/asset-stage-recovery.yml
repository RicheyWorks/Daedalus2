name: Portable asset stage recovery

on:
  pull_request:
    paths:
      - 'connectors/claude-asset-pipeline/asset_pipeline/stages.py'
      - 'connectors/claude-asset-pipeline/asset_pipeline/__init__.py'
      - 'connectors/claude-asset-pipeline/harness/stages_test.py'
      - 'connectors/claude-asset-pipeline/docs/stage-recovery.md'
      - '.github/workflows/asset-stage-recovery.yml'
  push:
    branches: [main]
    paths:
      - 'connectors/claude-asset-pipeline/asset_pipeline/stages.py'
      - 'connectors/claude-asset-pipeline/asset_pipeline/__init__.py'
      - 'connectors/claude-asset-pipeline/harness/stages_test.py'
      - 'connectors/claude-asset-pipeline/docs/stage-recovery.md'
      - '.github/workflows/asset-stage-recovery.yml'

permissions:
  contents: read

jobs:
  portable-stages:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Synthetic stage, clock and profile contracts
        working-directory: connectors/claude-asset-pipeline
        run: python -B harness/stages_test.py
