name: Prismheart Hall chord core
on:
  pull_request:
    paths:
      - 'engines/unreal/**/DaedalusHallChordCore.h'
      - 'engines/unreal/**/DaedalusEarRuleCore.h'
      - 'engines/unreal/core-test/hall_chord_core_test.cpp'
      - 'engines/unreal/core-test/hall_chord_golden.txt'
      - 'engines/unreal/**/DaedalusCueKitCore.h'
      - 'tools/minigames/hall_chord.py'
      - 'engines/unreal/**/DaedalusPyRandomCore.h'
      - 'tools/minigames/cue_kit.py'
      - '.github/workflows/hall-chord-core.yml'
  push:
    branches: [main]
    paths:
      - 'engines/unreal/**/DaedalusHallChordCore.h'
      - 'engines/unreal/**/DaedalusEarRuleCore.h'
      - 'engines/unreal/core-test/hall_chord_core_test.cpp'
      - 'engines/unreal/core-test/hall_chord_golden.txt'
      - 'engines/unreal/**/DaedalusCueKitCore.h'
      - 'tools/minigames/hall_chord.py'
      - 'engines/unreal/**/DaedalusPyRandomCore.h'
      - 'tools/minigames/cue_kit.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  parity:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        compiler: [g++, clang++]
    steps:
      - uses: actions/checkout@v7
      - name: Hall chord golden vectors + properties (sanitized, no FMA contraction)
        run: |
          ${{ matrix.compiler }} -std=c++17 -O1 -Wall -Wextra -Werror -ffp-contract=off -fsanitize=address,undefined -fno-omit-frame-pointer engines/unreal/core-test/hall_chord_core_test.cpp -o "$RUNNER_TEMP/hall_chord"
          "$RUNNER_TEMP/hall_chord" engines/unreal/core-test/hall_chord_golden.txt
      - name: Golden matches the Python rules reference
        run: |
          python3 tools/minigames/hall_chord.py --write "$RUNNER_TEMP/hall_chord_golden.txt"
          cmp "$RUNNER_TEMP/hall_chord_golden.txt" engines/unreal/core-test/hall_chord_golden.txt
  msvc:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Hall chord golden vectors + properties (MSVC cl /W4 /WX /fp:strict)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $out = Join-Path $env:RUNNER_TEMP 'hall_chord'
          New-Item -ItemType Directory -Force $out | Out-Null
          cl /nologo /std:c++17 /EHsc /W4 /WX /fp:strict engines/unreal/core-test/hall_chord_core_test.cpp "/Fo$out\hall_chord.obj" "/Fe$out\hall_chord.exe"
          if ($LASTEXITCODE) { throw "cl failed ($LASTEXITCODE)" }
          & "$out\hall_chord.exe" engines/unreal/core-test/hall_chord_golden.txt
          if ($LASTEXITCODE) { throw "hall_chord_core_test failed ($LASTEXITCODE)" }
