# SPDX-License-Identifier: MIT
name: PC job status
on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/pc/job_status.py'
      - 'tools/pc/test_job_status.py'
      - 'tools/pc/README.md'
      - '.github/workflows/pc-job-status.yml'
permissions:
  contents: read
jobs:
  snapshot:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - name: Read-only synthetic artifact regressions
        run: python -m unittest tools.pc.test_job_status -v
