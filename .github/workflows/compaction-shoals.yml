# SPDX-License-Identifier: MIT
name: Compaction Shoals
on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/streaming/compaction_shoals.py'
      - 'tools/streaming/compaction_shoals_test.py'
      - 'data/islands/disk-saver/compaction-shoals-v1.json'
      - 'data/islands/disk-saver/journal-tide-v1.json'
      - '.github/workflows/compaction-shoals.yml'
permissions:
  contents: read
jobs:
  compaction-shoals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - name: G86 Compaction Shoals rules (LSM lookups = dict, leveled vs traps, G79 tie-in)
        run: python -m unittest tools/streaming/compaction_shoals_test.py -v
      - name: CLI smoke (leveled keeper wins)
        run: python tools/streaming/compaction_shoals.py data/islands/disk-saver/compaction-shoals-v1.json
