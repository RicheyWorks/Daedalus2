# SPDX-License-Identifier: MIT
name: Plimsoll Lines
on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/streaming/plimsoll_lines.py'
      - 'tools/streaming/plimsoll_lines_test.py'
      - 'tools/streaming/census_budget.py'
      - 'tools/world_census/**'
      - 'data/islands/disk-saver/plimsoll-lines-v1.json'
      - 'data/islands/disk-saver/census-budget-v1.json'
      - '.github/workflows/plimsoll-lines.yml'
permissions:
  contents: read
jobs:
  plimsoll-lines:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - name: G522 Plimsoll Lines (headroom = brute-force oracle, cargo verdicts, real census, CLI)
        run: python -B -m unittest tools/streaming/plimsoll_lines_test.py -v
      - name: Lines on the real world census (--fail-on-sunk)
        run: |
          python -B -m tools.world_census tools/world_census/fixtures/alpha.json tools/world_census/fixtures/beta.json --snapshot-date 2026-10-26 --bindings tools/world_census/fixtures/bindings.json --output-dir "$RUNNER_TEMP/census"
          python tools/streaming/plimsoll_lines.py "$RUNNER_TEMP/census/census.json" --fail-on-sunk