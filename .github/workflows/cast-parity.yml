name: Cast manifest identity parity
on:
  push:
    branches: [main]
    paths:
      - 'tools/realms/cast_manifest_parity*'
      - 'data/art/**'
      - 'engines/unreal/DaedalusLink/Content/Casts/**'
      - '.github/workflows/cast-parity.yml'
  pull_request:
    paths:
      - 'tools/realms/cast_manifest_parity*'
      - 'data/art/**'
      - 'engines/unreal/DaedalusLink/Content/Casts/**'
      - '.github/workflows/cast-parity.yml'
permissions:
  contents: read
jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python tools/realms/cast_manifest_parity_test.py
      - run: python tools/realms/cast_manifest_parity.py --dcs engines/unreal/DaedalusLink/Content/Casts/gallery-city.dcs --manifest data/art/gallery/production-manifest.json --overlay data/art/cast-role-aliases.json
      - run: python tools/realms/cast_manifest_parity.py --dcs engines/unreal/DaedalusLink/Content/Casts/parcels.dcs --manifest data/art/parcels/production-manifest.json --overlay data/art/cast-role-aliases.json
      - run: python tools/realms/cast_manifest_parity.py --dcs engines/unreal/DaedalusLink/Content/Casts/bricks.dcs --manifest data/art/bricks/production-manifest.json --overlay data/art/cast-role-aliases.json
      - run: python tools/realms/cast_manifest_parity.py --dcs engines/unreal/DaedalusLink/Content/Casts/labyrinth.dcs --manifest data/art/labyrinth/production-manifest.json --overlay data/art/cast-role-aliases.json
