# SPDX-License-Identifier: MIT
#
# The island deed contract (ADR-028): compile RealmIslands with the pinned solc and run its tests,
# including the voucher the Java realm signed (chain/test/fixtures). Only when chain/ or the wallet
# module changes. Nothing here has a key or broadcasts anything.

name: Chain

on:
  push:
    branches: [ main ]
    paths: [ "chain/**", "daedalus-wallet/**", ".github/workflows/chain.yml" ]
  pull_request:
    branches: [ main ]
    paths: [ "chain/**", "daedalus-wallet/**", ".github/workflows/chain.yml" ]

concurrency:
  group: chain-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  realm-islands:
    name: RealmIslands contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: chain
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: chain/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx hardhat test
