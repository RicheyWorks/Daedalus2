name: Cast role alias preservation

on:
  push:
    branches: [main]
    paths:
      - 'tools/art/cast_role_alias.py'
      - 'tools/art/cast_role_alias_test.py'
      - '.github/workflows/cast-role-alias.yml'
  pull_request:
    paths:
      - 'tools/art/cast_role_alias.py'
      - 'tools/art/cast_role_alias_test.py'
      - '.github/workflows/cast-role-alias.yml'

permissions:
  contents: read

jobs:
  alias:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Verify offline metadata and binary preservation
        run: python -B -m unittest discover -s tools/art -p cast_role_alias_test.py -v
