name: Realm core
# The 8-bit realm's headless C++ (DaedalusRealmCore/Spec/Look/Draw/Sprites/Session/Directory, BattleStage) had
# portable tests but no CI job. This builds and runs them with sanitizers on two compilers, and with MSVC (/W4 /WX) as Unreal does on Windows.
on:
  pull_request:
    paths:
      - 'engines/unreal/**/DaedalusRealm*.h'
      - 'engines/unreal/**/DaedalusBattleStageCore.h'
      - 'engines/unreal/DaedalusLink/Content/Realm/**'
      - 'engines/unreal/core-test/realm_*'
      - 'tools/realm/sprites_parity.txt'
      - '.github/workflows/realm-core.yml'
  push:
    branches: [main]
    paths:
      - 'engines/unreal/**/DaedalusRealm*.h'
      - 'engines/unreal/DaedalusLink/Content/Realm/**'
      - 'engines/unreal/core-test/realm_*'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  realm:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [g++, clang++]
    defaults:
      run:
        working-directory: engines/unreal/core-test
    steps:
      - uses: actions/checkout@v4
      - name: Realm tests (sanitized)
        run: |
          set -euo pipefail
          for t in realm_spec_draw_test realm_core_test realm_session_test realm_directory_test realm_sprites_test realm_look_test; do
            ${{ matrix.compiler }} -std=c++17 -O1 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer \
              -I../DaedalusLink/Source/DaedalusLink/Public "$t.cpp" -o "$RUNNER_TEMP/$t"
          done
          "$RUNNER_TEMP/realm_spec_draw_test" | tail -1
          mkdir -p "$RUNNER_TEMP/realm-out"
          "$RUNNER_TEMP/realm_core_test" ../DaedalusLink/Content/Realm/realm-7.drr "$RUNNER_TEMP/realm-out" | tail -1
          "$RUNNER_TEMP/realm_session_test" | tail -1
          "$RUNNER_TEMP/realm_directory_test" | tail -1
          "$RUNNER_TEMP/realm_sprites_test" | tail -1
          "$RUNNER_TEMP/realm_look_test" | tail -1
  msvc:
    # Unreal builds the plugin with MSVC on Windows: compile the same headless realm cores with cl /W4 /WX.
    runs-on: windows-latest
    defaults:
      run:
        working-directory: engines/unreal/core-test
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Realm tests (MSVC /W4 /WX)
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'realm-msvc'
          New-Item -ItemType Directory -Force -Path $out, (Join-Path $out 'realm-out') | Out-Null
          $tests = @('realm_spec_draw_test', 'realm_core_test', 'realm_session_test', 'realm_directory_test', 'realm_sprites_test', 'realm_look_test')
          foreach ($t in $tests) {
            cl /nologo /EHsc /std:c++17 /W4 /WX /permissive- /utf-8 /I../DaedalusLink/Source/DaedalusLink/Public "$t.cpp" "/Fe:$out/$t.exe" "/Fo:$out/$t.obj"
            if ($LASTEXITCODE -ne 0) { Write-Error "$t failed to compile"; exit $LASTEXITCODE }
          }
          foreach ($t in $tests) {
            if ($t -eq 'realm_core_test') { & "$out/$t.exe" ../DaedalusLink/Content/Realm/realm-7.drr (Join-Path $out 'realm-out') | Select-Object -Last 1 }
            else { & "$out/$t.exe" | Select-Object -Last 1 }
            if ($LASTEXITCODE -ne 0) { Write-Error "$t failed"; exit $LASTEXITCODE }
          }
