# SPDX-License-Identifier: MIT
name: Tide Clocks
on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/streaming/tide_clocks.py'
      - 'tools/streaming/tide_clocks_test.py'
      - 'data/islands/disk-saver/tide-clocks-v1.json'
      - 'data/islands/disk-saver/compaction-shoals-v1.json'
      - '.github/workflows/tide-clocks.yml'
permissions:
  contents: read
jobs:
  tide-clocks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - name: G166 Tide Clocks rules (vector clock = happens-before oracle, Lamport consistent not complete, LWW loses edits, G86 tie-in)
        run: python -m unittest tools/streaming/tide_clocks_test.py -v
      - name: CLI smoke (vector clocks win)
        run: python tools/streaming/tide_clocks.py data/islands/disk-saver/tide-clocks-v1.json
