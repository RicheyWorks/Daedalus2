# SPDX-License-Identifier: MIT
# The live (or staging) Daedalus world server for players: one host, four services.
#
#   cp env.example .env && ./gen-secrets.sh >> .env   # then set DOMAIN etc. in .env
#   docker compose up -d --build
#
# Staging and live are two copies of this stack with their own .env and project name:
#   docker compose -p daedalus-staging --env-file staging.env up -d
# See README.md for the runbook (DNS, first boot, backups, restore drill, upgrades).
name: daedalus

services:
  server:
    build:
      context: ..
      dockerfile: Dockerfile
    image: daedalus-server:${DAEDALUS_VERSION:-local}
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: "8080"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env (gen-secrets.sh)}
      DAEDALUS_JWT_SECRET: ${DAEDALUS_JWT_SECRET:?set DAEDALUS_JWT_SECRET in .env (gen-secrets.sh)}
      DAEDALUS_ADMIN_PASSWORD_BCRYPT: ${DAEDALUS_ADMIN_PASSWORD_BCRYPT:?set DAEDALUS_ADMIN_PASSWORD_BCRYPT in .env}
      # Caddy overwrites X-Forwarded-For, so per-client rate limits see the real player IP.
      DAEDALUS_RL_TRUST_XFF: "true"
      # Wallet sign-in and deeds (ADR-028): testnet (Sepolia, 11155111) until Richey says otherwise.
      DAEDALUS_WALLET_ENABLED: ${DAEDALUS_WALLET_ENABLED:-false}
      DAEDALUS_WALLET_DOMAIN: ${DOMAIN:?set DOMAIN in .env}
      DAEDALUS_WALLET_URI: https://${DOMAIN}
      DAEDALUS_WALLET_CHAIN_ID: ${DAEDALUS_WALLET_CHAIN_ID:-11155111}
      DAEDALUS_WALLET_DEED_CONTRACT: ${DAEDALUS_WALLET_DEED_CONTRACT:-}
      DAEDALUS_WALLET_DEED_SIGNER_KEY: ${DAEDALUS_WALLET_DEED_SIGNER_KEY:-}
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=${DAEDALUS_HEAP_PERCENT:-75} -XX:+ExitOnOutOfMemoryError
    volumes:
      - worlds:/var/daedalus
    depends_on:
      redis:
        condition: service_healthy
    expose:
      - "8080"
    deploy:
      resources:
        limits:
          memory: ${DAEDALUS_SERVER_MEMORY:-6g}

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes", "--save", "300 10"]
    volumes:
      - redis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env (Let's Encrypt notices)}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - server

  backup:
    # Every BACKUP_EVERY_HOURS: a consistent tar of the worlds volume plus Redis' append-only file, kept
    # BACKUP_KEEP_DAYS. Copy ./backups off the host (see README) - a backup on the same disk is not a backup.
    image: alpine:3.20
    restart: unless-stopped
    environment:
      BACKUP_EVERY_HOURS: ${BACKUP_EVERY_HOURS:-6}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - worlds:/src/worlds:ro
      - redis:/src/redis:ro
      - ./backups:/backups
      - ./backup.sh:/backup.sh:ro
    entrypoint: ["/bin/sh", "-c", "while true; do /bin/sh /backup.sh /src /backups; sleep $$((BACKUP_EVERY_HOURS * 3600)); done"]

volumes:
  worlds:
  redis:
  caddy-data:
  caddy-config:
